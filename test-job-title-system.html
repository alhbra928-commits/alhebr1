<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار نظام المسمى الوظيفي</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; min-height: 100vh; }
    .container { max-width: 1200px; margin: 0 auto; background: white; border-radius: 20px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
    h1 { color: #667eea; margin-bottom: 20px; text-align: center; }
    .section { background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; }
    .section h2 { color: #333; margin-bottom: 15px; font-size: 18px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px; text-align: right; border-bottom: 1px solid #ddd; }
    th { background: #667eea; color: white; font-weight: bold; }
    tr:hover { background: #f0f0f0; }
    .status { display: inline-block; padding: 5px 15px; border-radius: 20px; font-size: 12px; font-weight: bold; }
    .status.success { background: #d4edda; color: #155724; }
    .status.error { background: #f8d7da; color: #721c24; }
    .status.warning { background: #fff3cd; color: #856404; }
    .btn { background: #667eea; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
    .btn:hover { background: #5568d3; }
    .log { background: #2d3748; color: #fff; padding: 15px; border-radius: 8px; font-family: 'Courier New', monospace; font-size: 12px; max-height: 300px; overflow-y: auto; }
    .log div { margin-bottom: 5px; }
    .empty { color: #999; text-align: center; padding: 20px; font-style: italic; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎯 اختبار نظام المسمى الوظيفي الكامل</h1>

    <div class="section">
      <h2>📊 جميع المستخدمين مع المسميات الوظيفية</h2>
      <div id="users-table"></div>
    </div>

    <div class="section">
      <h2>🔍 تفاصيل عمر (0500000011)</h2>
      <div id="omar-details"></div>
    </div>

    <div class="section">
      <h2>📝 سجل التنفيذ</h2>
      <div class="log" id="log"></div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
      <button class="btn" onclick="runTest()">🔄 إعادة الاختبار</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://bhtqgybizsqzlbahlkxi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodHFneWJpenNxemxiYWhsa3hpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MTc1ODEsImV4cCI6MjA0NDk5MzU4MX0.wquH2opi6VahklB1L0VIJlIEHvgJcOKTx_NZ5aY6Z3o';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function log(message, type = 'info') {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('ar-SA');
      const color = type === 'success' ? '#10b981' : type === 'error' ? '#ef4444' : '#60a5fa';
      logEl.innerHTML = `<div style="color: ${color}">[${time}] ${message}</div>` + logEl.innerHTML;
    }

    async function runTest() {
      const logEl = document.getElementById('log');
      logEl.innerHTML = '<div style="color: #fbbf24;">⏳ جارِ التحميل...</div>';

      try {
        log('🚀 بدء الاختبار الشامل...', 'info');

        // 1️⃣ جلب جميع المستخدمين
        log('1️⃣ جلب جميع المستخدمين من admin_users...', 'info');
        const { data: users, error: usersError } = await supabase
          .from('admin_users')
          .select('phone, full_name, job_title, job_title_en, is_active, created_at')
          .is('deleted_at', null)
          .order('created_at', { ascending: false });

        if (usersError) {
          log('❌ خطأ في جلب المستخدمين: ' + usersError.message, 'error');
          throw usersError;
        }

        log(`✅ تم جلب ${users.length} مستخدم بنجاح`, 'success');

        // عرض جدول المستخدمين
        const usersTable = document.getElementById('users-table');
        if (users.length === 0) {
          usersTable.innerHTML = '<div class="empty">لا يوجد مستخدمون</div>';
        } else {
          let tableHTML = `
            <table>
              <thead>
                <tr>
                  <th>الاسم</th>
                  <th>الجوال</th>
                  <th>المسمى الوظيفي</th>
                  <th>الحالة</th>
                </tr>
              </thead>
              <tbody>
          `;

          users.forEach(user => {
            const hasJobTitle = user.job_title ? 'success' : 'warning';
            const jobTitleText = user.job_title || 'غير محدد';
            tableHTML += `
              <tr>
                <td><strong>${user.full_name}</strong></td>
                <td>${user.phone}</td>
                <td><span class="status ${hasJobTitle}">${jobTitleText}</span></td>
                <td>${user.is_active ? '✅ مفعّل' : '❌ غير مفعّل'}</td>
              </tr>
            `;
          });

          tableHTML += '</tbody></table>';
          usersTable.innerHTML = tableHTML;
        }

        // 2️⃣ فحص عمر بالتحديد
        log('2️⃣ فحص بيانات عمر (0500000011)...', 'info');
        const omar = users.find(u => u.phone === '0500000011');
        const omarDetails = document.getElementById('omar-details');

        if (omar) {
          log('✅ تم العثور على عمر', 'success');
          omarDetails.innerHTML = `
            <table>
              <tr><th>الاسم الكامل</th><td>${omar.full_name}</td></tr>
              <tr><th>رقم الجوال</th><td>${omar.phone}</td></tr>
              <tr><th>المسمى الوظيفي (عربي)</th><td><span class="status ${omar.job_title ? 'success' : 'error'}">${omar.job_title || 'غير موجود ❌'}</span></td></tr>
              <tr><th>المسمى الوظيفي (إنجليزي)</th><td><span class="status ${omar.job_title_en ? 'success' : 'error'}">${omar.job_title_en || 'غير موجود ❌'}</span></td></tr>
              <tr><th>الحالة</th><td>${omar.is_active ? '✅ مفعّل' : '❌ غير مفعّل'}</td></tr>
              <tr><th>تاريخ الإنشاء</th><td>${new Date(omar.created_at).toLocaleString('ar-SA')}</td></tr>
            </table>
          `;

          if (omar.job_title) {
            log(`✅ عمر لديه مسمى وظيفي: ${omar.job_title}`, 'success');
          } else {
            log('⚠️ عمر ليس لديه مسمى وظيفي!', 'error');
          }
        } else {
          log('❌ لم يتم العثور على عمر في قاعدة البيانات', 'error');
          omarDetails.innerHTML = '<div class="empty">لم يتم العثور على المستخدم</div>';
        }

        // 3️⃣ إحصائيات عامة
        const withJobTitle = users.filter(u => u.job_title).length;
        const withoutJobTitle = users.length - withJobTitle;
        log(`📊 الإحصائيات: ${withJobTitle} لديهم مسمى، ${withoutJobTitle} بدون مسمى`, 'info');

        log('🎉 اكتمل الاختبار بنجاح!', 'success');

      } catch (error) {
        log('❌ خطأ في الاختبار: ' + error.message, 'error');
        console.error('Error:', error);
      }
    }

    // تشغيل الاختبار عند فتح الصفحة
    window.onload = runTest;
  </script>
</body>
</html>
