<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار إضافة مالك - عدم التكرار</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 50px auto;
      padding: 30px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 {
      color: #667eea;
      text-align: center;
      font-size: 2em;
      margin-bottom: 10px;
    }
    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }
    .test-section {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 12px;
      margin: 20px 0;
      border-left: 5px solid #667eea;
    }
    .test-section h2 {
      color: #667eea;
      font-size: 1.3em;
      margin-bottom: 15px;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 15px 30px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin: 10px 0;
      transition: transform 0.2s;
    }
    button:hover {
      transform: scale(1.05);
    }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
      transform: none;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 14px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 2px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 2px solid #f5c6cb;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 2px solid #bee5eb;
    }
    .warning {
      background: #fff3cd;
      color: #856404;
      border: 2px solid #ffeeba;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin: 20px 0;
    }
    .stat-card {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
    }
    .stat-card .number {
      font-size: 2em;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .stat-card .label {
      font-size: 0.9em;
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 اختبار إضافة مالك بدون تكرار</h1>
    <p class="subtitle">التحقق من عدم تكرار البطاقات عند الإضافة</p>

    <div class="test-section">
      <h2>📊 الإحصائيات الحالية</h2>
      <div class="stats" id="stats">
        <div class="stat-card">
          <div class="number" id="total-count">-</div>
          <div class="label">إجمالي البطاقات</div>
        </div>
        <div class="stat-card">
          <div class="number" id="pending-count">-</div>
          <div class="label">قيد المراجعة</div>
        </div>
        <div class="stat-card">
          <div class="number" id="approved-count">-</div>
          <div class="label">معتمد</div>
        </div>
      </div>
      <button onclick="loadStats()">🔄 تحديث الإحصائيات</button>
      <div id="stats-result" class="result info" style="display: none;"></div>
    </div>

    <div class="test-section">
      <h2>➕ إضافة بطاقة اختبار</h2>
      <button onclick="addTestOwner()" id="add-btn">إضافة مالك جديد</button>
      <div id="add-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
      <h2>🔍 التحقق من عدم التكرار</h2>
      <button onclick="checkDuplicates()">فحص البطاقات المكررة</button>
      <div id="duplicate-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
      <h2>📋 عرض جميع البطاقات</h2>
      <button onclick="listAllOwners()">عرض القائمة الكاملة</button>
      <div id="list-result" class="result" style="display: none;"></div>
    </div>

    <div class="test-section">
      <h2>🗑️ تنظيف البيانات</h2>
      <button onclick="cleanupAll()" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
        حذف جميع بطاقات الاختبار
      </button>
      <div id="cleanup-result" class="result" style="display: none;"></div>
    </div>
  </div>

  <script>
    // تكوين Supabase
    const SUPABASE_URL = 'https://xdjeygiadqavkmwarkfz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhkamV5Z2lhZHFhdmttd2Fya2Z6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MDc0NzksImV4cCI6MjA0NDk4MzQ3OX0.XR77o1VT4m3r6SLnXUtr5ogCqRCx9CdIY0kVyuUy-bw';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let addCount = 0;

    async function loadStats() {
      const statsEl = document.getElementById('stats-result');
      statsEl.style.display = 'block';
      statsEl.className = 'result info';
      statsEl.textContent = 'جاري تحميل الإحصائيات...';

      try {
        const { data, error } = await supabase
          .from('farm_owners')
          .select('id, approval_status', { count: 'exact' })
          .is('deleted_at', null);

        if (error) throw error;

        const total = data.length;
        const pending = data.filter(o => o.approval_status === 'pending').length;
        const approved = data.filter(o => o.approval_status === 'approved').length;

        document.getElementById('total-count').textContent = total;
        document.getElementById('pending-count').textContent = pending;
        document.getElementById('approved-count').textContent = approved;

        statsEl.className = 'result success';
        statsEl.textContent = `✅ تم التحديث!\n\nإجمالي البطاقات: ${total}\nقيد المراجعة: ${pending}\nمعتمد: ${approved}`;
      } catch (err) {
        statsEl.className = 'result error';
        statsEl.textContent = '❌ خطأ: ' + err.message;
      }
    }

    async function addTestOwner() {
      addCount++;
      const btn = document.getElementById('add-btn');
      const resultEl = document.getElementById('add-result');

      btn.disabled = true;
      resultEl.style.display = 'block';
      resultEl.className = 'result info';
      resultEl.textContent = '⏳ جاري إضافة المالك...';

      try {
        const testData = {
          full_name: `مالك اختبار ${addCount}`,
          mobile_number: `05${Math.floor(10000000 + Math.random() * 90000000)}`,
          email: `test${addCount}@example.com`,
          national_id: `1${Math.floor(100000000 + Math.random() * 900000000)}`,
          region: 'الرياض',
          city: 'الرياض',
          farm_type: 'نخيل',
          farm_area: 1000,
          farm_area_unit: 'متر مربع',
          total_palm_trees: 50,
          palm_tree_price: 500,
          available_palm_trees: 50,
          expected_annual_return: 8,
          bank_name: 'الراجحي',
          bank_account_number: 'SA1234567890',
          iban: 'SA0380000000608010167519',
          approval_status: 'pending',
          status: 'active'
        };

        console.log('📤 إرسال البيانات:', testData);

        const { data, error } = await supabase
          .from('farm_owners')
          .insert([testData])
          .select();

        if (error) throw error;

        console.log('✅ تم الإضافة:', data);

        resultEl.className = 'result success';
        resultEl.textContent = `✅ تم إضافة المالك بنجاح!\n\nالاسم: ${testData.full_name}\nالجوال: ${testData.mobile_number}\nالبريد: ${testData.email}\n\n⏰ انتظر 3 ثواني للتحقق من عدم التكرار...`;

        // التحقق من عدم التكرار بعد 3 ثواني
        setTimeout(async () => {
          await checkDuplicates();
          await loadStats();
        }, 3000);

      } catch (err) {
        console.error('❌ خطأ:', err);
        resultEl.className = 'result error';
        resultEl.textContent = '❌ فشل في إضافة المالك:\n\n' + err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function checkDuplicates() {
      const resultEl = document.getElementById('duplicate-result');
      resultEl.style.display = 'block';
      resultEl.className = 'result info';
      resultEl.textContent = '🔍 جاري البحث عن التكرارات...';

      try {
        const { data, error } = await supabase.rpc('check_duplicate_owners');

        if (error) {
          // محاولة بديلة
          const { data: owners, error: err2 } = await supabase
            .from('farm_owners')
            .select('mobile_number, full_name, id')
            .is('deleted_at', null);

          if (err2) throw err2;

          const grouped = {};
          owners.forEach(o => {
            if (!grouped[o.mobile_number]) {
              grouped[o.mobile_number] = [];
            }
            grouped[o.mobile_number].push(o);
          });

          const duplicates = Object.entries(grouped)
            .filter(([_, list]) => list.length > 1);

          if (duplicates.length === 0) {
            resultEl.className = 'result success';
            resultEl.textContent = '✅ ممتاز! لا توجد بطاقات مكررة\n\nإجمالي البطاقات: ' + owners.length;
          } else {
            resultEl.className = 'result error';
            resultEl.textContent = `⚠️ تم العثور على ${duplicates.length} تكرار:\n\n` +
              duplicates.map(([mobile, list]) =>
                `${mobile}: ${list.length} بطاقات\n${list.map(o => `  - ${o.full_name} (${o.id})`).join('\n')}`
              ).join('\n\n');
          }
        }
      } catch (err) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ خطأ: ' + err.message;
      }
    }

    async function listAllOwners() {
      const resultEl = document.getElementById('list-result');
      resultEl.style.display = 'block';
      resultEl.className = 'result info';
      resultEl.textContent = '📋 جاري تحميل القائمة...';

      try {
        const { data, error } = await supabase
          .from('farm_owners')
          .select('*')
          .is('deleted_at', null)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (data.length === 0) {
          resultEl.className = 'result warning';
          resultEl.textContent = '📭 لا توجد بطاقات في النظام';
        } else {
          resultEl.className = 'result success';
          resultEl.textContent = `📋 إجمالي البطاقات: ${data.length}\n\n` +
            data.map((o, i) =>
              `${i + 1}. ${o.full_name}\n` +
              `   📱 ${o.mobile_number}\n` +
              `   📧 ${o.email || 'لا يوجد'}\n` +
              `   📊 الحالة: ${o.approval_status}\n` +
              `   🕐 ${new Date(o.created_at).toLocaleString('ar-SA')}\n`
            ).join('\n');
        }
      } catch (err) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ خطأ: ' + err.message;
      }
    }

    async function cleanupAll() {
      if (!confirm('⚠️ هل أنت متأكد من حذف جميع بطاقات الاختبار؟')) {
        return;
      }

      const resultEl = document.getElementById('cleanup-result');
      resultEl.style.display = 'block';
      resultEl.className = 'result info';
      resultEl.textContent = '🗑️ جاري الحذف...';

      try {
        const { data, error } = await supabase
          .from('farm_owners')
          .update({
            deleted_at: new Date().toISOString(),
            deleted_by: '00000000-0000-0000-0000-000000000000'
          })
          .is('deleted_at', null)
          .select();

        if (error) throw error;

        resultEl.className = 'result success';
        resultEl.textContent = `✅ تم الحذف بنجاح!\n\nعدد البطاقات المحذوفة: ${data.length}`;

        await loadStats();
      } catch (err) {
        resultEl.className = 'result error';
        resultEl.textContent = '❌ خطأ: ' + err.message;
      }
    }

    // تحميل الإحصائيات عند بدء الصفحة
    window.addEventListener('load', loadStats);
  </script>
</body>
</html>
