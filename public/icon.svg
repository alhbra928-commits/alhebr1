<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A0916A;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="url(#grad1)"/>

  <!-- Palm Tree Icon -->
  <g transform="translate(256, 256)">
    <!-- Trunk -->
    <rect x="-20" y="0" width="40" height="150" fill="#6B4423" rx="10"/>

    <!-- Leaves -->
    <ellipse cx="0" cy="-40" rx="80" ry="40" fill="#2F855A" transform="rotate(-30)"/>
    <ellipse cx="0" cy="-40" rx="80" ry="40" fill="#2F855A" transform="rotate(30)"/>
    <ellipse cx="0" cy="-40" rx="80" ry="40" fill="#38A169"/>
    <ellipse cx="0" cy="-50" rx="70" ry="35" fill="#48BB78" transform="rotate(-15)"/>
    <ellipse cx="0" cy="-50" rx="70" ry="35" fill="#48BB78" transform="rotate(15)"/>

    <!-- Dates/Olives -->
    <circle cx="-15" cy="-20" r="8" fill="#F59E0B"/>
    <circle cx="15" cy="-20" r="8" fill="#F59E0B"/>
    <circle cx="0" cy="-10" r="8" fill="#F59E0B"/>
  </g>

  <!-- Arabic Text: النخيل -->
  <text x="256" y="440" font-family="Arial" font-size="48" font-weight="bold" fill="white" text-anchor="middle">النخيل</text>
</svg>
