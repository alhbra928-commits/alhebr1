<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مسح الكاش - إجباري</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ECFDF5 0%, #F0FDF4 50%, #F0FDFA 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 24px;
      padding: 40px;
      max-width: 600px;
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.2);
      border: 2px solid #D1FAE5;
      text-align: center;
    }
    h1 {
      background: linear-gradient(135deg, #10B981, #22C55E, #14B8A6);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 900;
    }
    p {
      color: #374151;
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .status {
      background: #ECFDF5;
      border: 2px solid #10B981;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      font-weight: bold;
      color: #065F46;
    }
    .progress {
      width: 100%;
      height: 8px;
      background: #D1FAE5;
      border-radius: 999px;
      overflow: hidden;
      margin: 20px 0;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #10B981, #22C55E);
      width: 0%;
      transition: width 0.3s ease;
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0% { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    button {
      background: linear-gradient(135deg, #10B981, #22C55E, #14B8A6);
      color: white;
      border: none;
      padding: 16px 40px;
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
      transition: all 0.3s ease;
      margin-top: 20px;
    }
    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
    }
    button:active {
      transform: translateY(0);
    }
    .success {
      color: #10B981;
      font-size: 3rem;
      margin-bottom: 1rem;
    }
    .checklist {
      text-align: right;
      background: #F9FAFB;
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }
    .checklist-item {
      padding: 10px;
      margin: 8px 0;
      background: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
    }
    .checklist-item.done {
      background: #ECFDF5;
      border-right: 4px solid #10B981;
    }
    .check {
      color: #10B981;
      font-size: 1.5rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌿 مسح الكاش الإجباري</h1>
    <p>جاري مسح جميع الكاش وتطبيق النمط الأخضر الجديد...</p>

    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="status" id="status">
      ⏳ جاري التحضير...
    </div>

    <div class="checklist" id="checklist">
      <div class="checklist-item" id="step1">
        <span class="check">⏳</span>
        <span>مسح localStorage</span>
      </div>
      <div class="checklist-item" id="step2">
        <span class="check">⏳</span>
        <span>مسح sessionStorage</span>
      </div>
      <div class="checklist-item" id="step3">
        <span class="check">⏳</span>
        <span>مسح IndexedDB</span>
      </div>
      <div class="checklist-item" id="step4">
        <span class="check">⏳</span>
        <span>مسح Cookies</span>
      </div>
      <div class="checklist-item" id="step5">
        <span class="check">⏳</span>
        <span>مسح Cache API</span>
      </div>
      <div class="checklist-item" id="step6">
        <span class="check">⏳</span>
        <span>تطبيق الثيم الأخضر</span>
      </div>
    </div>

    <button id="startBtn" onclick="forceCacheClear()">
      🚀 ابدأ المسح الآن
    </button>
  </div>

  <script>
    let progress = 0;

    function updateProgress(percent) {
      progress = percent;
      document.getElementById('progressBar').style.width = percent + '%';
    }

    function markStepDone(stepId) {
      const step = document.getElementById(stepId);
      step.classList.add('done');
      step.querySelector('.check').textContent = '✅';
    }

    async function forceCacheClear() {
      const btn = document.getElementById('startBtn');
      const status = document.getElementById('status');

      btn.disabled = true;
      btn.textContent = '⏳ جاري المسح...';

      try {
        // Step 1: Clear localStorage
        status.textContent = '🗑️ مسح localStorage...';
        updateProgress(16);
        localStorage.clear();
        await sleep(500);
        markStepDone('step1');

        // Step 2: Clear sessionStorage
        status.textContent = '🗑️ مسح sessionStorage...';
        updateProgress(32);
        sessionStorage.clear();
        await sleep(500);
        markStepDone('step2');

        // Step 3: Clear IndexedDB
        status.textContent = '🗑️ مسح IndexedDB...';
        updateProgress(48);
        const databases = await indexedDB.databases();
        for (const db of databases) {
          if (db.name) {
            indexedDB.deleteDatabase(db.name);
          }
        }
        await sleep(500);
        markStepDone('step3');

        // Step 4: Clear Cookies
        status.textContent = '🗑️ مسح Cookies...';
        updateProgress(64);
        document.cookie.split(";").forEach(function(c) {
          document.cookie = c.replace(/^ +/, "").replace(/=.*/, "=;expires=" + new Date().toUTCString() + ";path=/");
        });
        await sleep(500);
        markStepDone('step4');

        // Step 5: Clear Cache API
        status.textContent = '🗑️ مسح Cache API...';
        updateProgress(80);
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
        }
        await sleep(500);
        markStepDone('step5');

        // Step 6: Apply Green Theme
        status.textContent = '🌿 تطبيق الثيم الأخضر...';
        updateProgress(90);
        document.body.classList.add('royal-green-theme');
        localStorage.setItem('theme', 'royal-green');
        localStorage.setItem('force-reload', Date.now().toString());
        await sleep(500);
        markStepDone('step6');

        // Complete
        updateProgress(100);
        status.textContent = '✅ تم المسح بنجاح!';
        status.style.background = '#ECFDF5';
        status.style.borderColor = '#10B981';

        // Show success message
        setTimeout(() => {
          status.innerHTML = '<div class="success">✨</div><h2 style="color: #10B981; margin: 0;">جاهز!</h2><p style="margin-top: 10px;">سيتم إعادة التحميل الآن...</p>';
        }, 500);

        // Force reload with cache bypass
        setTimeout(() => {
          window.location.href = '/?v=' + Date.now() + '#force-reload';
          setTimeout(() => {
            window.location.reload(true);
          }, 100);
        }, 2000);

      } catch (error) {
        console.error('خطأ في مسح الكاش:', error);
        status.textContent = '❌ حدث خطأ: ' + error.message;
        status.style.background = '#FEE2E2';
        status.style.borderColor = '#EF4444';
        btn.disabled = false;
        btn.textContent = '🔄 حاول مرة أخرى';
      }
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Auto-start after 2 seconds
    setTimeout(() => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('auto') === 'true') {
        forceCacheClear();
      }
    }, 1000);
  </script>
</body>
</html>
