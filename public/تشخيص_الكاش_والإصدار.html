<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔍 تشخيص الكاش والإصدار</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #1e4620 0%, #2c5f2d 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .header {
      text-align: center;
      color: white;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    .card {
      background: white;
      border-radius: 15px;
      padding: 25px;
      margin-bottom: 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
    }

    .card-title {
      color: #2c5f2d;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-item {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .status-good {
      background: rgba(81, 207, 102, 0.1);
      border: 2px solid #51cf66;
    }

    .status-bad {
      background: rgba(255, 107, 107, 0.1);
      border: 2px solid #ff6b6b;
    }

    .status-warning {
      background: rgba(255, 184, 0, 0.1);
      border: 2px solid #ffb800;
    }

    .label {
      font-weight: bold;
      color: #333;
    }

    .value {
      font-family: 'Courier New', monospace;
      color: #666;
    }

    .button {
      background: linear-gradient(135deg, #2c5f2d 0%, #1e4620 100%);
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: all 0.3s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(44, 95, 45, 0.3);
    }

    .button-danger {
      background: linear-gradient(135deg, #e03131 0%, #c92a2a 100%);
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    .spinner {
      border: 3px solid rgba(44, 95, 45, 0.1);
      border-top: 3px solid #2c5f2d;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .code-block {
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .badge-success {
      background: #51cf66;
      color: white;
    }

    .badge-error {
      background: #ff6b6b;
      color: white;
    }

    .badge-warning {
      background: #ffb800;
      color: white;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 تشخيص الكاش والإصدار</h1>
    <p>فحص شامل لحالة الكاش والإصدارات المحملة</p>
  </div>

  <div class="container">
    <!-- Version Check -->
    <div class="card">
      <div class="card-title">📦 فحص الإصدار</div>
      <div id="versionCheck" class="loading">
        <div class="spinner"></div>
        جاري فحص الإصدار...
      </div>
    </div>

    <!-- Cache Check -->
    <div class="card">
      <div class="card-title">💾 فحص الكاش</div>
      <div id="cacheCheck" class="loading">
        <div class="spinner"></div>
        جاري فحص الكاش...
      </div>
    </div>

    <!-- Service Worker Check -->
    <div class="card">
      <div class="card-title">⚙️ فحص Service Worker</div>
      <div id="swCheck" class="loading">
        <div class="spinner"></div>
        جاري فحص Service Worker...
      </div>
    </div>

    <!-- Ticker Check -->
    <div class="card">
      <div class="card-title">🎯 فحص الشريط المتحرك</div>
      <div id="tickerCheck" class="loading">
        <div class="spinner"></div>
        جاري فحص كود الشريط...
      </div>
    </div>

    <!-- Actions -->
    <div class="card">
      <div class="card-title">🛠️ الإجراءات</div>
      <button class="button button-danger" onclick="clearEverything()">
        🗑️ مسح كل الكاش والإصدارات القديمة
      </button>
      <button class="button" onclick="reloadPage()">
        🔄 إعادة تحميل الصفحة
      </button>
      <button class="button" onclick="runDiagnostic()">
        🔍 إعادة الفحص
      </button>
    </div>
  </div>

  <script>
    const EXPECTED_VERSION = 'v20251219_1766160865329';
    const EXPECTED_TICKER_CODE = 'Array.from({ length: 10 })';

    async function checkVersion() {
      const container = document.getElementById('versionCheck');
      try {
        const response = await fetch('/version-manifest.json?_=' + Date.now());
        const data = await response.json();

        const currentVersion = data.version || 'غير معروف';
        const isLatest = currentVersion === EXPECTED_VERSION;

        container.innerHTML = `
          <div class="status-item ${isLatest ? 'status-good' : 'status-bad'}">
            <span class="label">الإصدار الحالي:</span>
            <span class="badge ${isLatest ? 'badge-success' : 'badge-error'}">
              ${currentVersion}
            </span>
          </div>
          <div class="status-item ${isLatest ? 'status-good' : 'status-warning'}">
            <span class="label">الإصدار المتوقع:</span>
            <span class="badge badge-success">${EXPECTED_VERSION}</span>
          </div>
          ${!isLatest ? `
            <div style="margin-top: 15px; padding: 15px; background: rgba(255, 107, 107, 0.1); border-radius: 8px; color: #e03131; font-weight: bold;">
              ⚠️ الإصدار قديم! يجب مسح الكاش!
            </div>
          ` : `
            <div style="margin-top: 15px; padding: 15px; background: rgba(81, 207, 102, 0.1); border-radius: 8px; color: #2b8a3e; font-weight: bold;">
              ✅ الإصدار محدث!
            </div>
          `}
        `;
      } catch (error) {
        container.innerHTML = `
          <div class="status-item status-bad">
            <span class="label">خطأ:</span>
            <span class="value">${error.message}</span>
          </div>
        `;
      }
    }

    async function checkCache() {
      const container = document.getElementById('cacheCheck');
      try {
        if (!('caches' in window)) {
          container.innerHTML = `
            <div class="status-item status-warning">
              <span class="label">Cache API غير مدعوم</span>
            </div>
          `;
          return;
        }

        const cacheNames = await caches.keys();
        const cacheCount = cacheNames.length;

        let html = `
          <div class="status-item ${cacheCount > 0 ? 'status-warning' : 'status-good'}">
            <span class="label">عدد الكاش المخزن:</span>
            <span class="badge ${cacheCount > 0 ? 'badge-warning' : 'badge-success'}">
              ${cacheCount}
            </span>
          </div>
        `;

        if (cacheCount > 0) {
          html += '<div class="code-block">';
          cacheNames.forEach(name => {
            html += `${name}<br>`;
          });
          html += '</div>';
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(255, 184, 0, 0.1); border-radius: 8px; color: #e67700; font-weight: bold;">
              ⚠️ يوجد كاش مخزن قد يمنع التحديثات!
            </div>
          `;
        } else {
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(81, 207, 102, 0.1); border-radius: 8px; color: #2b8a3e; font-weight: bold;">
              ✅ لا يوجد كاش مخزن!
            </div>
          `;
        }

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `
          <div class="status-item status-bad">
            <span class="label">خطأ:</span>
            <span class="value">${error.message}</span>
          </div>
        `;
      }
    }

    async function checkServiceWorker() {
      const container = document.getElementById('swCheck');
      try {
        if (!('serviceWorker' in navigator)) {
          container.innerHTML = `
            <div class="status-item status-warning">
              <span class="label">Service Worker غير مدعوم</span>
            </div>
          `;
          return;
        }

        const registrations = await navigator.serviceWorker.getRegistrations();
        const swCount = registrations.length;

        let html = `
          <div class="status-item ${swCount > 0 ? 'status-warning' : 'status-good'}">
            <span class="label">عدد Service Workers:</span>
            <span class="badge ${swCount > 0 ? 'badge-warning' : 'badge-success'}">
              ${swCount}
            </span>
          </div>
        `;

        if (swCount > 0) {
          html += '<div class="code-block">';
          registrations.forEach(reg => {
            html += `Scope: ${reg.scope}<br>State: ${reg.active ? reg.active.state : 'inactive'}<br><br>`;
          });
          html += '</div>';
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(255, 184, 0, 0.1); border-radius: 8px; color: #e67700; font-weight: bold;">
              ⚠️ Service Worker نشط قد يخزن النسخ القديمة!
            </div>
          `;
        } else {
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(81, 207, 102, 0.1); border-radius: 8px; color: #2b8a3e; font-weight: bold;">
              ✅ لا يوجد Service Worker نشط!
            </div>
          `;
        }

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `
          <div class="status-item status-bad">
            <span class="label">خطأ:</span>
            <span class="value">${error.message}</span>
          </div>
        `;
      }
    }

    async function checkTicker() {
      const container = document.getElementById('tickerCheck');
      try {
        // Try to fetch main JS bundle
        const response = await fetch('/assets/index.js?_=' + Date.now());
        const code = await response.text();

        const has10x = code.includes('length:10') || code.includes('length: 10');
        const hasArrayFrom = code.includes('Array.from');

        let html = `
          <div class="status-item ${hasArrayFrom ? 'status-good' : 'status-bad'}">
            <span class="label">يحتوي على Array.from:</span>
            <span class="badge ${hasArrayFrom ? 'badge-success' : 'badge-error'}">
              ${hasArrayFrom ? 'نعم ✅' : 'لا ❌'}
            </span>
          </div>
          <div class="status-item ${has10x ? 'status-good' : 'status-bad'}">
            <span class="label">يحتوي على تكرار 10x:</span>
            <span class="badge ${has10x ? 'badge-success' : 'badge-error'}">
              ${has10x ? 'نعم ✅' : 'لا ❌'}
            </span>
          </div>
        `;

        if (!has10x || !hasArrayFrom) {
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(255, 107, 107, 0.1); border-radius: 8px; color: #e03131; font-weight: bold;">
              ❌ الكود القديم لا يزال محملاً! يجب مسح الكاش!
            </div>
          `;
        } else {
          html += `
            <div style="margin-top: 15px; padding: 15px; background: rgba(81, 207, 102, 0.1); border-radius: 8px; color: #2b8a3e; font-weight: bold;">
              ✅ الكود الجديد محمل بشكل صحيح!
            </div>
          `;
        }

        container.innerHTML = html;
      } catch (error) {
        container.innerHTML = `
          <div class="status-item status-bad">
            <span class="label">خطأ:</span>
            <span class="value">${error.message}</span>
          </div>
        `;
      }
    }

    async function clearEverything() {
      if (!confirm('هل أنت متأكد من مسح كل الكاش والإصدارات القديمة؟')) {
        return;
      }

      try {
        // Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(cacheNames.map(name => caches.delete(name)));
          console.log('✅ Cleared all caches');
        }

        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(reg => reg.unregister()));
          console.log('✅ Unregistered all service workers');
        }

        // Clear localStorage
        localStorage.clear();
        console.log('✅ Cleared localStorage');

        // Clear sessionStorage
        sessionStorage.clear();
        console.log('✅ Cleared sessionStorage');

        alert('✅ تم مسح كل الكاش بنجاح!\n\nسيتم إعادة تحميل الصفحة...');

        // Reload without cache
        window.location.reload(true);
      } catch (error) {
        alert('❌ خطأ أثناء المسح: ' + error.message);
      }
    }

    function reloadPage() {
      window.location.reload(true);
    }

    function runDiagnostic() {
      checkVersion();
      checkCache();
      checkServiceWorker();
      checkTicker();
    }

    // Run on load
    runDiagnostic();
  </script>
</body>
</html>
