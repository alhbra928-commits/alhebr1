<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الشارات الحية - منصة النخيل والزيتون</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #FFF8E7 0%, #FFE4B5 100%);
            padding: 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 36px;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .status-box {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: bold;
            margin-top: 20px;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-loading {
            background: #fff3cd;
            color: #856404;
        }

        .farms-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 30px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .farm-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .farm-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(0,0,0,0.2);
        }

        .farm-image {
            width: 100%;
            height: 250px;
            background: linear-gradient(135deg, #D4AF37 0%, #C5A028 100%);
            position: relative;
            overflow: hidden;
        }

        .farm-image::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.4) 100%);
        }

        /* الشارة الذهبية للمزارع المكتملة */
        .badge-full {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            background: linear-gradient(135deg, #D4AF37 0%, #C5A028 50%, #B8942A 100%);
            color: #1a1a1a;
            border: 2px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 30px rgba(212, 175, 55, 0.5), 0 0 20px rgba(212, 175, 55, 0.3);
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* الشارة الخضراء للمزارع المتقدمة */
        .badge-almost {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            background: linear-gradient(135deg, rgba(139, 165, 116, 0.95) 0%, rgba(107, 142, 35, 0.95) 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(139, 165, 116, 0.4);
            animation: pulse-glow 5s ease-in-out infinite;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* الشارة الخضراء للمزارع المفتوحة */
        .badge-open {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 20;
            padding: 10px 18px;
            border-radius: 12px;
            font-weight: 900;
            font-size: 13px;
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.95) 0%, rgba(5, 150, 105, 0.95) 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 8px 25px rgba(139, 165, 116, 0.4);
                opacity: 1;
            }
            50% {
                box-shadow: 0 8px 35px rgba(139, 165, 116, 0.6), 0 0 25px rgba(139, 165, 116, 0.3);
                opacity: 0.95;
            }
        }

        .farm-content {
            padding: 25px;
        }

        .farm-title {
            font-size: 24px;
            font-weight: 900;
            color: #2d3748;
            margin-bottom: 20px;
        }

        .farm-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            background: #f7fafc;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-label {
            font-size: 12px;
            color: #718096;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 900;
            color: #2d3748;
        }

        .progress-container {
            background: #e2e8f0;
            height: 30px;
            border-radius: 15px;
            overflow: hidden;
            margin: 20px 0;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #D4AF37, #C5A028, #B8942A);
            transition: width 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 900;
            font-size: 14px;
        }

        .progress-bar-full {
            background: linear-gradient(90deg, #D4AF37, #C5A028, #B8942A);
        }

        .farm-button {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-active {
            background: linear-gradient(135deg, #D4AF37 0%, #B8942A 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .btn-active:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.4);
        }

        .btn-disabled {
            background: linear-gradient(135deg, rgba(156, 163, 175, 0.9) 0%, rgba(107, 114, 128, 0.9) 100%);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            cursor: not-allowed;
            opacity: 0.8;
        }

        .db-status {
            background: #f7fafc;
            padding: 10px 15px;
            border-radius: 8px;
            margin-top: 15px;
            font-size: 13px;
            text-align: center;
        }

        .loading-spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #D4AF37;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🌴 اختبار نظام الشارات الحية</h1>
        <p style="font-size: 18px; color: #718096; margin-top: 10px;">
            هذه الصفحة تعرض المزارع مباشرة من قاعدة البيانات مع الشارات الجديدة
        </p>
        <div id="status" class="status-box status-loading">
            🔄 جاري الاتصال بقاعدة البيانات...
        </div>
    </div>

    <div id="farms-container" class="farms-grid"></div>

    <script>
        const SUPABASE_URL = 'https://jajqkqfvuddsgsrbjqxk.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphanFrcWZ2dWRkc2dzcmJqcXhrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjkzMjk3OTgsImV4cCI6MjA0NDkwNTc5OH0.3b7i-s7Vj1-4-nWlUKl6VzsvOLMEWA99D1zk9eJJ3Bc';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function loadFarms() {
            try {
                const statusEl = document.getElementById('status');
                const container = document.getElementById('farms-container');

                const { data: farms, error } = await supabase
                    .from('farms')
                    .select('*')
                    .is('deleted_at', null)
                    .order('sales_status', { ascending: false })
                    .order('created_at', { ascending: false });

                if (error) throw error;

                statusEl.textContent = `✅ تم تحميل ${farms.length} مزرعة بنجاح`;
                statusEl.className = 'status-box status-success';

                container.innerHTML = '';

                farms.forEach(farm => {
                    const totalTrees = farm.total_trees || 0;
                    const availableTrees = farm.available_trees || 0;
                    const bookedTrees = totalTrees - availableTrees;
                    const bookingPercentage = totalTrees > 0
                        ? Math.round((bookedTrees / totalTrees) * 100)
                        : 0;

                    const isFull = farm.sales_status === 'closed' || bookingPercentage === 100;
                    const isAlmost = bookingPercentage >= 60 && !isFull;
                    const isOpen = bookingPercentage < 60 && !isFull;

                    const card = document.createElement('div');
                    card.className = 'farm-card';

                    let badges = '';
                    if (isFull) {
                        badges = `
                            <div class="badge-full">
                                <span style="font-size: 18px;">✨</span>
                                <span>اكتمل البيع – جميع أشجار المزرعة تم حجزها</span>
                            </div>
                        `;
                    } else if (isAlmost) {
                        badges = `
                            <div class="badge-almost">
                                <span style="font-size: 18px;">🌿</span>
                                <span>اقترب اكتمال الحجز!</span>
                            </div>
                        `;
                    } else if (isOpen) {
                        badges = `
                            <div class="badge-open">
                                <span style="font-size: 18px;">🌟</span>
                                <span>مفتوح للحجز</span>
                            </div>
                        `;
                    }

                    const btnClass = isFull ? 'btn-disabled' : 'btn-active';
                    const btnIcon = isFull ? '🔒' : '🌴';
                    const btnText = isFull ? 'تم اكتمال الحجز بالكامل' : 'ابدأ رحلتك الآن';

                    card.innerHTML = `
                        <div class="farm-image">
                            ${badges}
                        </div>

                        <div class="farm-content">
                            <div class="farm-title">${farm.name_ar || 'مزرعة'}</div>

                            <div class="farm-stats">
                                <div class="stat-box">
                                    <div class="stat-label">إجمالي الأشجار</div>
                                    <div class="stat-value">${totalTrees.toLocaleString('ar-SA')}</div>
                                </div>
                                <div class="stat-box">
                                    <div class="stat-label">المتاح</div>
                                    <div class="stat-value" style="color: ${availableTrees > 0 ? '#10b981' : '#ef4444'}">
                                        ${availableTrees.toLocaleString('ar-SA')}
                                    </div>
                                </div>
                            </div>

                            <div class="progress-container">
                                <div class="progress-bar ${isFull ? 'progress-bar-full' : ''}"
                                     style="width: ${bookingPercentage}%">
                                    ${bookingPercentage}%
                                </div>
                            </div>

                            <button class="farm-button ${btnClass}" ${isFull ? 'disabled' : ''}>
                                <span style="font-size: 24px;">${btnIcon}</span>
                                <span>${btnText}</span>
                            </button>

                            <div class="db-status">
                                <strong>حالة قاعدة البيانات:</strong>
                                <span style="color: ${farm.sales_status === 'closed' ? '#ef4444' : '#10b981'}; font-weight: 900;">
                                    ${farm.sales_status === 'closed' ? 'مغلقة (closed)' : 'مفتوحة (open)'}
                                </span>
                            </div>
                        </div>
                    `;

                    container.appendChild(card);
                });

            } catch (error) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = `❌ خطأ: ${error.message}`;
                statusEl.className = 'status-box status-error';
                console.error('Error:', error);
            }
        }

        loadFarms();
    </script>
</body>
</html>
