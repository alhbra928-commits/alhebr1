<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار ثبات القوالب الوهمية</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.5);
        }
        .subtitle {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 40px;
            color: #94a3b8;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            background: rgba(30, 41, 59, 0.8);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 16px;
            padding: 20px;
        }
        .panel h2 {
            color: #3b82f6;
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .stat-box {
            background: rgba(59, 130, 246, 0.1);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            text-align: center;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #3b82f6;
        }
        .stat-label {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 5px;
        }
        .template-item {
            background: rgba(59, 130, 246, 0.05);
            border: 2px solid rgba(59, 130, 246, 0.2);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            transition: all 0.3s;
        }
        .template-item:hover {
            border-color: rgba(59, 130, 246, 0.5);
            transform: translateX(-5px);
        }
        .template-item.inactive {
            opacity: 0.5;
            background: rgba(100, 100, 100, 0.1);
        }
        .template-icon {
            font-size: 2rem;
        }
        .template-info {
            flex: 1;
        }
        .template-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .template-meta {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .status-badge.active {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
            border: 2px solid rgba(34, 197, 94, 0.5);
        }
        .status-badge.inactive {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 2px solid rgba(239, 68, 68, 0.5);
        }
        .button {
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }
        .button.small {
            padding: 6px 12px;
            font-size: 0.85rem;
        }
        .button.danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .button.success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
        }
        .log {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(59, 130, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            max-height: 400px;
            overflow-y: auto;
            font-size: 0.9rem;
        }
        .log-entry {
            padding: 5px 0;
            border-bottom: 1px solid rgba(59, 130, 246, 0.1);
        }
        .log-entry.success { color: #22c55e; }
        .log-entry.error { color: #ef4444; }
        .log-entry.info { color: #3b82f6; }
        .log-entry.warning { color: #f59e0b; }
        .test-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .realtime-indicator {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 5px 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid rgba(34, 197, 94, 0.5);
            border-radius: 8px;
            font-size: 0.85rem;
            color: #22c55e;
        }
        .realtime-indicator.active {
            animation: pulse 2s ease-in-out infinite;
        }
        .realtime-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            animation: pulse 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار ثبات القوالب الوهمية</h1>
        <p class="subtitle">اختبار شامل للتأكد من عدم عودة القوالب للتفعيل تلقائياً</p>

        <div class="grid">
            <!-- Stats Panel -->
            <div class="panel">
                <h2>📊 الإحصائيات اللحظية</h2>
                <div class="stats-grid">
                    <div class="stat-box">
                        <div class="stat-value" id="totalCount">0</div>
                        <div class="stat-label">إجمالي</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" style="color: #22c55e;" id="activeCount">0</div>
                        <div class="stat-label">نشطة</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-value" style="color: #ef4444;" id="inactiveCount">0</div>
                        <div class="stat-label">معطلة</div>
                    </div>
                </div>
                <div style="text-align: center; margin-top: 10px;">
                    <span class="realtime-indicator" id="realtimeIndicator">
                        <span class="realtime-dot"></span>
                        Realtime متصل
                    </span>
                </div>
            </div>

            <!-- Realtime Events Panel -->
            <div class="panel">
                <h2>⚡ أحداث Realtime</h2>
                <div id="realtimeEvents" class="log" style="max-height: 150px;"></div>
            </div>
        </div>

        <!-- Test Controls -->
        <div class="panel">
            <h2>🎮 عمليات الاختبار</h2>
            <div class="test-controls">
                <button class="button" onclick="addTestTemplate()">
                    ➕ إضافة قالب
                </button>
                <button class="button success" onclick="toggleAll(true)">
                    ▶️ تفعيل الكل
                </button>
                <button class="button danger" onclick="toggleAll(false)">
                    ⏸️ تعطيل الكل
                </button>
                <button class="button" onclick="testPersistence()">
                    🧪 اختبار الثبات
                </button>
                <button class="button" onclick="loadTemplates()">
                    🔄 تحديث
                </button>
            </div>
        </div>

        <!-- Templates List -->
        <div class="panel">
            <h2>📋 القوالب الوهمية</h2>
            <div id="templatesList"></div>
        </div>

        <!-- Log Panel -->
        <div class="panel">
            <h2>📝 سجل الأحداث</h2>
            <div id="log" class="log"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bhtihsrrhlumgpwbgrei.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodGloc3JyaGx1bWdwd2JncmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjkzNDY2NjcsImV4cCI6MjA0NDkyMjY2N30.HUck1hLx32VWzz_5ZqWlhmV_OGGCJgNc5a-CQ7lHoJk';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let templates = [];
        let realtimeChannel = null;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const icon = type === 'success' ? '✅' : type === 'error' ? '❌' : type === 'warning' ? '⚠️' : 'ℹ️';
            logDiv.innerHTML = `<div class="log-entry ${type}">${icon} [${timestamp}] ${message}</div>` + logDiv.innerHTML;
            console.log(`[${type}] ${message}`);
        }

        function logRealtime(message) {
            const realtimeDiv = document.getElementById('realtimeEvents');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            realtimeDiv.innerHTML = `<div class="log-entry info">⚡ [${timestamp}] ${message}</div>` + realtimeDiv.innerHTML;
        }

        async function loadTemplates() {
            log('🔍 جاري تحميل القوالب...', 'info');
            try {
                const { data, error } = await supabase
                    .from('simulated_activities')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                templates = data;
                log(`✅ تم تحميل ${data.length} قالب`, 'success');
                displayTemplates();
                updateStats();
            } catch (err) {
                log(`❌ خطأ: ${err.message}`, 'error');
            }
        }

        function updateStats() {
            const total = templates.length;
            const active = templates.filter(t => t.is_active).length;
            const inactive = total - active;

            document.getElementById('totalCount').textContent = total;
            document.getElementById('activeCount').textContent = active;
            document.getElementById('inactiveCount').textContent = inactive;
        }

        function displayTemplates() {
            const container = document.getElementById('templatesList');

            if (templates.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #94a3b8; padding: 40px;">لا توجد قوالب</p>';
                return;
            }

            container.innerHTML = templates.map(t => `
                <div class="template-item ${!t.is_active ? 'inactive' : ''}">
                    <div class="template-icon">${t.icon}</div>
                    <div class="template-info">
                        <div class="template-title">${t.template_ar}</div>
                        <div class="template-meta">
                            ${t.activity_category} • وزن: ${t.weight} • ${t.id.substring(0, 8)}
                        </div>
                    </div>
                    <span class="status-badge ${t.is_active ? 'active' : 'inactive'}">
                        ${t.is_active ? '✅ نشط' : '⏸️ معطل'}
                    </span>
                    <button class="button small ${t.is_active ? 'danger' : 'success'}"
                            onclick="toggleTemplate('${t.id}', ${t.is_active})">
                        ${t.is_active ? '⏸️ تعطيل' : '▶️ تفعيل'}
                    </button>
                </div>
            `).join('');
        }

        async function toggleTemplate(id, currentState) {
            const shortId = id.substring(0, 8);
            const newState = !currentState;
            log(`${newState ? '▶️' : '⏸️'} ${newState ? 'تفعيل' : 'تعطيل'} ${shortId}...`, 'info');

            try {
                const { error } = await supabase
                    .from('simulated_activities')
                    .update({ is_active: newState })
                    .eq('id', id);

                if (error) throw error;

                log(`✅ تم ${newState ? 'التفعيل' : 'التعطيل'} بنجاح`, 'success');

                // التحقق الفوري
                setTimeout(async () => {
                    const { data } = await supabase
                        .from('simulated_activities')
                        .select('is_active')
                        .eq('id', id)
                        .single();

                    if (data.is_active === newState) {
                        log(`✅ تحقق: الحالة صحيحة (${newState ? 'نشط' : 'معطل'})`, 'success');
                    } else {
                        log(`❌ خطأ: الحالة عادت إلى ${data.is_active ? 'نشط' : 'معطل'}!`, 'error');
                    }
                }, 1000);

            } catch (err) {
                log(`❌ فشل: ${err.message}`, 'error');
            }
        }

        async function addTestTemplate() {
            log('➕ إضافة قالب تجريبي...', 'info');
            try {
                const { error } = await supabase
                    .from('simulated_activities')
                    .insert({
                        template_ar: `قالب اختبار ${Date.now()}`,
                        template_en: `Test Template ${Date.now()}`,
                        icon: ['🧪', '🔬', '⚗️', '🧬'][Math.floor(Math.random() * 4)],
                        activity_category: 'stats',
                        weight: 50,
                        is_active: true
                    });

                if (error) throw error;
                log('✅ تم إضافة قالب تجريبي', 'success');
            } catch (err) {
                log(`❌ فشل: ${err.message}`, 'error');
            }
        }

        async function toggleAll(state) {
            const action = state ? 'تفعيل' : 'تعطيل';
            log(`⚙️ ${action} جميع القوالب (${templates.length})...`, 'info');

            try {
                const ids = templates.map(t => t.id);
                const { error } = await supabase
                    .from('simulated_activities')
                    .update({ is_active: state })
                    .in('id', ids);

                if (error) throw error;
                log(`✅ تم ${action} ${templates.length} قالب`, 'success');
            } catch (err) {
                log(`❌ فشل: ${err.message}`, 'error');
            }
        }

        async function testPersistence() {
            log('🧪 بدء اختبار الثبات...', 'warning');

            if (templates.length === 0) {
                log('⚠️ لا توجد قوالب للاختبار', 'warning');
                return;
            }

            const testTemplate = templates[0];
            const originalState = testTemplate.is_active;
            const id = testTemplate.id;

            log(`📌 اختبار القالب: ${testTemplate.template_ar}`, 'info');
            log(`📌 الحالة الأصلية: ${originalState ? 'نشط' : 'معطل'}`, 'info');

            // الخطوة 1: تغيير الحالة
            log('1️⃣ تغيير الحالة...', 'info');
            await toggleTemplate(id, originalState);

            // الخطوة 2: انتظار 2 ثانية
            await new Promise(resolve => setTimeout(resolve, 2000));

            // الخطوة 3: التحقق من الثبات
            log('2️⃣ التحقق من الثبات بعد 2 ثانية...', 'info');
            const { data: check1 } = await supabase
                .from('simulated_activities')
                .select('is_active')
                .eq('id', id)
                .single();

            if (check1.is_active === !originalState) {
                log('✅ النتيجة 1: الحالة ثابتة (بعد 2 ثانية)', 'success');
            } else {
                log('❌ النتيجة 1: الحالة عادت للأصلية!', 'error');
            }

            // الخطوة 4: انتظار 5 ثواني
            await new Promise(resolve => setTimeout(resolve, 5000));

            // الخطوة 5: التحقق النهائي
            log('3️⃣ التحقق النهائي بعد 7 ثواني...', 'info');
            const { data: check2 } = await supabase
                .from('simulated_activities')
                .select('is_active')
                .eq('id', id)
                .single();

            if (check2.is_active === !originalState) {
                log('✅ النتيجة النهائية: الحالة ثابتة تماماً! 🎉', 'success');
            } else {
                log('❌ النتيجة النهائية: الحالة عادت للأصلية! ⚠️', 'error');
            }

            // إعادة الحالة الأصلية
            log('4️⃣ إعادة الحالة الأصلية...', 'info');
            await toggleTemplate(id, !originalState);

            log('✅ اختبار الثبات مكتمل!', 'success');
        }

        function setupRealtime() {
            log('🔌 إعداد Realtime subscription...', 'info');

            realtimeChannel = supabase
                .channel('simulated_activities_test')
                .on(
                    'postgres_changes',
                    { event: '*', schema: 'public', table: 'simulated_activities' },
                    (payload) => {
                        const eventType = payload.eventType;
                        logRealtime(`${eventType} event received`);

                        if (eventType === 'INSERT') {
                            log('⚡ Realtime: قالب جديد تم إضافته', 'info');
                        } else if (eventType === 'UPDATE') {
                            const newData = payload.new;
                            log(`⚡ Realtime: تحديث → ${newData.is_active ? 'نشط' : 'معطل'}`, 'info');
                        } else if (eventType === 'DELETE') {
                            log('⚡ Realtime: قالب تم حذفه', 'info');
                        }

                        // إعادة تحميل البيانات
                        setTimeout(() => loadTemplates(), 100);
                    }
                )
                .subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        log('✅ Realtime subscription نشط', 'success');
                        document.getElementById('realtimeIndicator').classList.add('active');
                    } else {
                        log(`⚠️ Realtime status: ${status}`, 'warning');
                    }
                });
        }

        // Initialize
        window.onload = () => {
            log('🚀 تحميل صفحة الاختبار', 'success');
            setupRealtime();
            loadTemplates();
        };

        // Cleanup
        window.onbeforeunload = () => {
            if (realtimeChannel) {
                supabase.removeChannel(realtimeChannel);
            }
        };
    </script>
</body>
</html>
