<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف Cache - إظهار التصميم الداكن</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            text-align: center;
        }
        h1 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 32px;
        }
        .warning {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #856404;
        }
        .success {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            color: #155724;
            display: none;
        }
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin: 10px;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
        }
        button:active {
            transform: scale(0.95);
        }
        .log {
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
            text-align: right;
            display: none;
        }
        .log-item {
            padding: 5px;
            border-bottom: 1px solid #e9ecef;
        }
        .log-item:last-child {
            border-bottom: none;
        }
        .log-error { color: #dc3545; }
        .log-success { color: #28a745; }
        .log-info { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 حذف Cache للتصميم الداكن</h1>
        
        <div class="warning">
            <strong>⚠️ المشكلة:</strong>
            <p>التصميم الداكن موجود في الكود لكن المتصفح يعرض النسخة القديمة من الـ cache.</p>
        </div>

        <p style="margin: 20px 0; font-size: 18px;">
            اضغط الزر أدناه لحذف كل الـ cache وإعادة التحميل
        </p>

        <button onclick="clearEverything()">🚀 حذف Cache وإعادة التحميل</button>

        <div id="successBox" class="success">
            <strong>✅ تم بنجاح!</strong>
            <p>سيتم إعادة التحميل خلال 3 ثواني...</p>
        </div>

        <div id="logBox" class="log"></div>

        <p style="margin-top: 30px; color: #6c757d; font-size: 14px;">
            ملاحظة: بياناتك المحفوظة (تسجيل الدخول) ستبقى آمنة
        </p>
    </div>

    <script>
        function log(message, type = 'info') {
            const logBox = document.getElementById('logBox');
            logBox.style.display = 'block';
            const item = document.createElement('div');
            item.className = 'log-item log-' + type;
            item.textContent = message;
            logBox.appendChild(item);
            logBox.scrollTop = logBox.scrollHeight;
        }

        async function clearEverything() {
            try {
                log('🔄 بدء عملية الحذف...', 'info');

                // حفظ بيانات المصادقة
                const auth = {};
                const authKeys = [
                    'admin_session_token',
                    'admin_data',
                    'investor_phone',
                    'investor_data',
                    'farm_owner_session',
                    'farm_owner_data'
                ];
                
                authKeys.forEach(key => {
                    const value = localStorage.getItem(key);
                    if (value) {
                        auth[key] = value;
                        log(`💾 حفظ: ${key}`, 'info');
                    }
                });

                // حذف localStorage
                log('🗑️ حذف localStorage...', 'info');
                localStorage.clear();
                log('✅ تم حذف localStorage', 'success');

                // حذف sessionStorage
                log('🗑️ حذف sessionStorage...', 'info');
                sessionStorage.clear();
                log('✅ تم حذف sessionStorage', 'success');

                // حذف Cache API
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    log(`🗑️ حذف ${cacheNames.length} caches...`, 'info');
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                    log('✅ تم حذف جميع الـ caches', 'success');
                }

                // إلغاء Service Workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    log(`🗑️ إلغاء ${registrations.length} service workers...`, 'info');
                    await Promise.all(registrations.map(reg => reg.unregister()));
                    log('✅ تم إلغاء جميع الـ service workers', 'success');
                }

                // استرجاع بيانات المصادقة
                Object.keys(auth).forEach(key => {
                    localStorage.setItem(key, auth[key]);
                    log(`♻️ استرجاع: ${key}`, 'success');
                });

                // حفظ النسخة الجديدة
                localStorage.setItem('app-version', 'DARK_FINAL_v20251030_002');
                log('✅ تم حفظ النسخة الجديدة', 'success');

                // إظهار رسالة النجاح
                document.getElementById('successBox').style.display = 'block';
                log('🎉 اكتمل! إعادة التحميل...', 'success');

                // إعادة التحميل
                setTimeout(() => {
                    const baseUrl = window.location.origin;
                    window.location.href = baseUrl + '/?_nocache=' + Date.now();
                }, 3000);

            } catch (error) {
                log('❌ خطأ: ' + error.message, 'error');
                alert('حدث خطأ: ' + error.message);
            }
        }
    </script>
</body>
</html>
