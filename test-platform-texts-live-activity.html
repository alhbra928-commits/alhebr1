<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار نصوص شريط النشاط المباشر</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      padding: 2rem;
      color: #F5F5DC;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #D4AF37;
      margin-bottom: 2rem;
      font-size: 2.5rem;
      text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
    }
    .status {
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2rem;
      text-align: center;
      font-weight: bold;
      border: 2px solid;
    }
    .status.loading {
      background: rgba(255, 165, 0, 0.2);
      border-color: #FFA500;
      color: #FFA500;
    }
    .status.success {
      background: rgba(34, 197, 94, 0.2);
      border-color: #22C55E;
      color: #22C55E;
    }
    .status.error {
      background: rgba(239, 68, 68, 0.2);
      border-color: #EF4444;
      color: #EF4444;
    }
    .stats-card {
      background: rgba(44, 95, 45, 0.2);
      border: 2px solid #2C5F2D;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
      text-align: center;
    }
    .stats-number {
      font-size: 4rem;
      color: #D4AF37;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
    }
    .stats-label {
      color: #F5F5DC;
      font-size: 1.2rem;
      margin-top: 0.5rem;
    }
    .section {
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #2C5F2D;
      border-radius: 12px;
      padding: 2rem;
      margin-bottom: 2rem;
    }
    .section h2 {
      color: #D4AF37;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.8rem;
    }
    .texts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1rem;
    }
    .text-card {
      background: rgba(44, 95, 45, 0.1);
      border: 1px solid rgba(212, 175, 55, 0.3);
      border-radius: 8px;
      padding: 1rem;
      transition: all 0.3s ease;
    }
    .text-card:hover {
      background: rgba(44, 95, 45, 0.2);
      border-color: rgba(212, 175, 55, 0.6);
      transform: translateY(-2px);
    }
    .text-key {
      font-size: 0.85rem;
      color: #9CA3AF;
      margin-bottom: 0.5rem;
      font-family: monospace;
    }
    .text-ar {
      color: #D4AF37;
      font-weight: bold;
      margin-bottom: 0.25rem;
      font-size: 1.1rem;
    }
    .text-en {
      color: #F5F5DC;
      font-size: 0.9rem;
      opacity: 0.8;
      margin-bottom: 0.5rem;
    }
    .text-desc {
      color: #9CA3AF;
      font-size: 0.8rem;
      font-style: italic;
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      padding-top: 0.5rem;
      margin-top: 0.5rem;
    }
    .category-header {
      background: linear-gradient(90deg, rgba(212, 175, 55, 0.2), transparent);
      padding: 0.75rem 1rem;
      border-right: 4px solid #D4AF37;
      margin: 1.5rem 0 1rem 0;
      border-radius: 4px;
    }
    .category-title {
      color: #D4AF37;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .category-count {
      color: #9CA3AF;
      font-size: 0.9rem;
      margin-right: 10px;
    }
    .search-box {
      width: 100%;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid #2C5F2D;
      border-radius: 8px;
      color: #F5F5DC;
      font-size: 1rem;
      margin-bottom: 2rem;
    }
    .search-box:focus {
      outline: none;
      border-color: #D4AF37;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 نصوص شريط النشاط المباشر</h1>

    <div id="status" class="status loading">
      ⏳ جاري تحميل النصوص...
    </div>

    <div class="stats-card">
      <div class="stats-number" id="total-count">0</div>
      <div class="stats-label">نص قابل للتعديل</div>
    </div>

    <input
      type="text"
      class="search-box"
      id="search-box"
      placeholder="🔍 ابحث في النصوص..."
    />

    <div class="section">
      <h2>📋 جميع النصوص</h2>
      <div id="texts-container">
        <p style="text-align: center; color: #9CA3AF;">جاري التحميل...</p>
      </div>
    </div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

    const SUPABASE_URL = 'https://vfbqltncrkbrbagwgjwi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZmYnFsdG5jcmticmJhZ3dnandpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MDE2MDYsImV4cCI6MjA0NDk3NzYwNn0.fh5nhL5L3oqhlNqXnlwbvMv_JNI05J4yt_NrUK1htMg';

    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allTexts = [];

    const categories = {
      'عام': [1, 9],
      'أوضاع المحتوى': [10, 19],
      'الأنشطة التلقائية': [20, 29],
      'الإعدادات': [30, 39],
      'الحالة': [40, 49],
      'السرعة': [50, 59],
      'الخلفية': [60, 69],
      'الأزرار': [70, 79],
      'النماذج': [80, 89],
      'الرسائل': [90, 99],
      'المساعدة': [100, 109],
      'الإحصائيات': [110, 119],
      'القوالب': [120, 129],
      'التبويبات': [130, 139],
      'العناوين': [140, 149],
      'الوصف': [150, 159]
    };

    function updateStatus(message, type = 'loading') {
      const statusEl = document.getElementById('status');
      statusEl.textContent = message;
      statusEl.className = `status ${type}`;
    }

    function getCategoryForOrder(order) {
      for (const [category, [min, max]] of Object.entries(categories)) {
        if (order >= min && order <= max) {
          return category;
        }
      }
      return 'أخرى';
    }

    function renderTexts(texts) {
      if (texts.length === 0) {
        document.getElementById('texts-container').innerHTML =
          '<p style="text-align: center; color: #9CA3AF;">لا توجد نتائج</p>';
        return;
      }

      // Group by category
      const grouped = {};
      texts.forEach(text => {
        const category = getCategoryForOrder(text.display_order);
        if (!grouped[category]) {
          grouped[category] = [];
        }
        grouped[category].push(text);
      });

      let html = '';
      Object.keys(grouped).sort().forEach(category => {
        const categoryTexts = grouped[category];
        html += `
          <div class="category-header">
            <span class="category-title">${category}</span>
            <span class="category-count">(${categoryTexts.length})</span>
          </div>
          <div class="texts-grid">
            ${categoryTexts.map(text => `
              <div class="text-card">
                <div class="text-key">${text.key}</div>
                <div class="text-ar">${text.text_ar}</div>
                <div class="text-en">${text.text_en}</div>
                <div class="text-desc">${text.description}</div>
              </div>
            `).join('')}
          </div>
        `;
      });

      document.getElementById('texts-container').innerHTML = html;
    }

    async function loadTexts() {
      try {
        updateStatus('⏳ جاري تحميل النصوص...', 'loading');

        const { data, error } = await supabase
          .from('platform_texts')
          .select('*')
          .eq('section', 'live_activity')
          .order('display_order', { ascending: true });

        if (error) throw error;

        allTexts = data || [];
        document.getElementById('total-count').textContent = allTexts.length;

        renderTexts(allTexts);

        updateStatus(`✅ تم تحميل ${allTexts.length} نص بنجاح`, 'success');
      } catch (error) {
        console.error('Error:', error);
        updateStatus('❌ حدث خطأ في التحميل', 'error');
      }
    }

    // Search functionality
    document.getElementById('search-box').addEventListener('input', (e) => {
      const searchTerm = e.target.value.toLowerCase().trim();

      if (!searchTerm) {
        renderTexts(allTexts);
        return;
      }

      const filtered = allTexts.filter(text =>
        text.key.toLowerCase().includes(searchTerm) ||
        text.text_ar.toLowerCase().includes(searchTerm) ||
        text.text_en.toLowerCase().includes(searchTerm) ||
        text.description.toLowerCase().includes(searchTerm)
      );

      renderTexts(filtered);
    });

    // Initialize
    loadTexts();
  </script>
</body>
</html>
