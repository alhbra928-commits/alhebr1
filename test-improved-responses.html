<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✅ اختبار الردود المحسّنة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      color: white;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 40px;
      background: linear-gradient(135deg, rgba(139, 115, 85, 0.2) 0%, rgba(160, 145, 106, 0.2) 100%);
      border-radius: 20px;
      border: 2px solid rgba(160, 145, 106, 0.3);
    }
    .header h1 {
      font-size: 42px;
      margin-bottom: 15px;
      background: linear-gradient(135deg, #A0916A 0%, #D4AF37 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .test-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }
    .test-card {
      background: rgba(255,255,255,0.05);
      padding: 25px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .test-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(160, 145, 106, 0.3);
    }
    .test-title {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #A0916A;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .test-button {
      background: linear-gradient(135deg, #8B7355 0%, #A0916A 100%);
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .test-button:hover {
      transform: scale(1.05);
      box-shadow: 0 5px 20px rgba(139, 115, 85, 0.5);
    }
    .test-button:active {
      transform: scale(0.98);
    }
    .result {
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 10px;
      margin-top: 15px;
      border-right: 4px solid #10B981;
      max-height: 400px;
      overflow-y: auto;
      display: none;
    }
    .result.show {
      display: block;
      animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .message-bubble {
      background: linear-gradient(135deg, rgba(139, 115, 85, 0.3) 0%, rgba(160, 145, 106, 0.3) 100%);
      padding: 15px;
      border-radius: 15px;
      margin: 10px 0;
      border: 1px solid rgba(160, 145, 106, 0.4);
    }
    .message-text {
      color: #fff;
      line-height: 1.6;
      font-size: 15px;
    }
    .message-meta {
      display: flex;
      gap: 15px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.1);
      font-size: 13px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }
    .badge-success {
      background: rgba(16, 185, 129, 0.2);
      color: #10B981;
      border: 1px solid #10B981;
    }
    .badge-info {
      background: rgba(59, 130, 246, 0.2);
      color: #3B82F6;
      border: 1px solid #3B82F6;
    }
    .badge-warning {
      background: rgba(251, 191, 36, 0.2);
      color: #FBBF24;
      border: 1px solid #FBBF24;
    }
    .run-all {
      text-align: center;
      margin: 40px 0;
    }
    .run-all-button {
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: white;
      border: none;
      padding: 20px 50px;
      border-radius: 15px;
      cursor: pointer;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.3);
      transition: all 0.3s;
    }
    .run-all-button:hover {
      transform: translateY(-3px);
      box-shadow: 0 15px 40px rgba(16, 185, 129, 0.5);
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #3B82F6;
    }
    .spinner {
      border: 3px solid rgba(255,255,255,0.1);
      border-top: 3px solid #A0916A;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      display: inline-block;
      margin-left: 10px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>✅ اختبار الردود المحسّنة</h1>
      <p style="color: #9CA3AF; font-size: 18px; margin-top: 10px;">
        اختبار الردود الطبيعية والمترابطة للزر الذكي
      </p>
    </div>

    <div class="test-grid">
      <!-- Test 1 -->
      <div class="test-card">
        <div class="test-title">
          <span>😊</span>
          <span>كيف حالك؟</span>
        </div>
        <button class="test-button" onclick="testMessage('كيف حالك', 'result1')">
          اختبر الآن
        </button>
        <div id="result1" class="result"></div>
      </div>

      <!-- Test 2 -->
      <div class="test-card">
        <div class="test-title">
          <span>☀️</span>
          <span>صباح الخير</span>
        </div>
        <button class="test-button" onclick="testMessage('صباح الخير', 'result2')">
          اختبر الآن
        </button>
        <div id="result2" class="result"></div>
      </div>

      <!-- Test 3 -->
      <div class="test-card">
        <div class="test-title">
          <span>🌙</span>
          <span>مساء الخير</span>
        </div>
        <button class="test-button" onclick="testMessage('مساء الخير', 'result3')">
          اختبر الآن
        </button>
        <div id="result3" class="result"></div>
      </div>

      <!-- Test 4 -->
      <div class="test-card">
        <div class="test-title">
          <span>🤲</span>
          <span>السلام عليكم</span>
        </div>
        <button class="test-button" onclick="testMessage('السلام عليكم', 'result4')">
          اختبر الآن
        </button>
        <div id="result4" class="result"></div>
      </div>

      <!-- Test 5 -->
      <div class="test-card">
        <div class="test-title">
          <span>🌟</span>
          <span>هلا</span>
        </div>
        <button class="test-button" onclick="testMessage('هلا', 'result5')">
          اختبر الآن
        </button>
        <div id="result5" class="result"></div>
      </div>

      <!-- Test 6 -->
      <div class="test-card">
        <div class="test-title">
          <span>💬</span>
          <span>ممكن سؤال؟</span>
        </div>
        <button class="test-button" onclick="testMessage('ممكن سؤال', 'result6')">
          اختبر الآن
        </button>
        <div id="result6" class="result"></div>
      </div>

      <!-- Test 7 -->
      <div class="test-card">
        <div class="test-title">
          <span>🙏</span>
          <span>يعطيك العافية</span>
        </div>
        <button class="test-button" onclick="testMessage('يعطيك العافية', 'result7')">
          اختبر الآن
        </button>
        <div id="result7" class="result"></div>
      </div>

      <!-- Test 8 -->
      <div class="test-card">
        <div class="test-title">
          <span>👍</span>
          <span>تمام</span>
        </div>
        <button class="test-button" onclick="testMessage('تمام', 'result8')">
          اختبر الآن
        </button>
        <div id="result8" class="result"></div>
      </div>
    </div>

    <div class="run-all">
      <button class="run-all-button" onclick="runAllTests()">
        🚀 تشغيل جميع الاختبارات
      </button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://fqhdnoqytbhtasiqilpi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZxaGRub3F5dGJodGFzaXFpbHBpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MDg3MjYsImV4cCI6MjA0NDk4NDcyNn0.cPdmuSYQwz94C7wQzunbhHlRFZdvKPmvvxGjsxh1Xoc';

    const { createClient } = supabase;
    const supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testMessage(message, resultId) {
      const resultDiv = document.getElementById(resultId);
      resultDiv.classList.add('show');
      resultDiv.innerHTML = '<div class="loading">⏳ جاري الاختبار...<div class="spinner"></div></div>';

      try {
        const sessionToken = 'test_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

        const { data, error } = await supabaseClient.rpc('handle_smart_button_ai_v2', {
          p_session_token: sessionToken,
          p_message: message,
          p_user_type: 'visitor',
          p_user_id: null,
          p_phone_number: null,
          p_page_url: window.location.href,
          p_ip_address: '127.0.0.1'
        });

        if (error) {
          resultDiv.innerHTML = `<p style="color: #EF4444;">❌ خطأ: ${error.message}</p>`;
          return;
        }

        let html = '<div class="message-bubble">';

        // Response text
        if (data.response) {
          html += `<div class="message-text">${data.response.replace(/\n/g, '<br>')}</div>`;
        }

        // Meta info
        html += '<div class="message-meta">';
        html += `<span class="badge badge-info">النية: ${data.intent || 'غير معروف'}</span>`;
        html += `<span class="badge badge-warning">المشاعر: ${data.sentiment || 'محايد'}</span>`;
        if (data.confidence) {
          const conf = (parseFloat(data.confidence) * 100).toFixed(0);
          html += `<span class="badge badge-success">الثقة: ${conf}%</span>`;
        }
        html += '</div>';

        html += '</div>';

        resultDiv.innerHTML = html;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color: #EF4444;">❌ خطأ: ${err.message}</p>`;
      }
    }

    async function runAllTests() {
      const tests = [
        { msg: 'كيف حالك', id: 'result1' },
        { msg: 'صباح الخير', id: 'result2' },
        { msg: 'مساء الخير', id: 'result3' },
        { msg: 'السلام عليكم', id: 'result4' },
        { msg: 'هلا', id: 'result5' },
        { msg: 'ممكن سؤال', id: 'result6' },
        { msg: 'يعطيك العافية', id: 'result7' },
        { msg: 'تمام', id: 'result8' }
      ];

      for (const test of tests) {
        await testMessage(test.msg, test.id);
        await new Promise(resolve => setTimeout(resolve, 800));
      }
    }
  </script>
</body>
</html>
