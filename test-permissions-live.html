<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🔴 LIVE - اختبار الصلاحيات المباشر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #1a1a2e;
      color: #eee;
      padding: 20px;
      font-size: 14px;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      text-align: center;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 5px;
    }
    .subtitle {
      opacity: 0.9;
      font-size: 14px;
    }
    .section {
      background: #16213e;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      border: 2px solid #0f3460;
    }
    .section-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 15px;
      color: #4ecca3;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .test-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: #0f3460;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .test-label {
      font-weight: 600;
    }
    .test-result {
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
    }
    .result-true {
      background: #c6f6d5;
      color: #22543d;
    }
    .result-false {
      background: #fed7d7;
      color: #742a2a;
    }
    .result-pending {
      background: #feebc8;
      color: #7c2d12;
    }
    .code-block {
      background: #0a0e27;
      border: 1px solid #4ecca3;
      border-radius: 8px;
      padding: 15px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
      margin-top: 10px;
    }
    .highlight {
      color: #4ecca3;
      font-weight: 700;
    }
    .error {
      color: #fc5185;
    }
    .success {
      color: #4ecca3;
    }
    .warning {
      color: #f39c12;
    }
    button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }
    button:hover {
      opacity: 0.9;
    }
    .live-indicator {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: #fc5185;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="live-indicator"></span> اختبار الصلاحيات LIVE</h1>
    <p class="subtitle">فحص مباشر للصلاحيات والأزرار</p>
  </div>

  <div class="section">
    <div class="section-title">🔐 1. بيانات الاتصال</div>
    <div class="code-block">
      <div>SUPABASE_URL: <span class="highlight" id="db-url">جاري التحميل...</span></div>
      <div>Connection: <span id="db-status" class="result-pending">⏳</span></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">👤 2. معلومات المستخدم</div>
    <div id="user-info">جاري التحميل...</div>
  </div>

  <div class="section">
    <div class="section-title">🔑 3. الصلاحيات من قاعدة البيانات</div>
    <div id="db-permissions">جاري التحميل...</div>
  </div>

  <div class="section">
    <div class="section-title">⚙️ 4. اختبار hasPermission()</div>
    <div id="permission-tests">جاري التحميل...</div>
  </div>

  <div class="section">
    <div class="section-title">🎯 5. النتيجة النهائية</div>
    <div id="final-result">جاري التحميل...</div>
  </div>

  <button onclick="location.reload()">🔄 إعادة الاختبار</button>
  <button onclick="window.location.href='/'">🏠 العودة للرئيسية</button>

  <script>
    const SUPABASE_URL = 'https://wseqkvknelkntxnuaexh.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndzZXFrdmtuZWxrbnR4bnVhZXhoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MzU4MDUsImV4cCI6MjA0NTAxMTgwNX0.eVFci1l5gP0LNIb-o4qIrGg_XF_TIRLEtSXaHt3BxsE';
    const TEST_PHONE = '0510101010'; // جنا
    const SUPER_ADMIN_PHONES = ['0500000000'];

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Show connection info
    document.getElementById('db-url').textContent = SUPABASE_URL.substring(0, 40) + '...';

    // Test hasPermission logic
    function testHasPermission(isAdmin, permissions, moduleId, action) {
      console.log(`Testing: isAdmin=${isAdmin}, module=${moduleId}, action=${action}`);

      if (isAdmin) {
        return true;
      }

      if (!permissions || permissions.length === 0) {
        return false;
      }

      const permission = permissions.find(p => p.module_id === moduleId && p.is_active);

      if (!permission) {
        return false;
      }

      switch (action) {
        case 'view': return permission.can_view;
        case 'create': return permission.can_create;
        case 'edit': return permission.can_edit;
        case 'delete': return permission.can_delete;
        default: return false;
      }
    }

    async function runTests() {
      try {
        // Test DB connection
        const { data: testData, error: testError } = await supabase
          .from('admin_users')
          .select('count')
          .limit(1);

        document.getElementById('db-status').innerHTML = testError
          ? '<span class="error">❌ فشل الاتصال</span>'
          : '<span class="success">✅ متصل</span>';

        // Get user info
        const { data: admin, error: adminError } = await supabase
          .from('admin_users')
          .select('*')
          .eq('phone', TEST_PHONE)
          .maybeSingle();

        if (adminError) throw adminError;

        const isSuperAdmin = SUPER_ADMIN_PHONES.includes(admin?.phone);

        document.getElementById('user-info').innerHTML = `
          <div class="test-row">
            <span class="test-label">رقم الجوال:</span>
            <span class="test-result result-true">${admin?.phone || 'غير موجود'}</span>
          </div>
          <div class="test-row">
            <span class="test-label">الاسم:</span>
            <span class="test-result result-true">${admin?.full_name || '-'}</span>
          </div>
          <div class="test-row">
            <span class="test-label">Super Admin:</span>
            <span class="test-result ${isSuperAdmin ? 'result-true' : 'result-false'}">
              ${isSuperAdmin ? '✅ نعم' : '❌ لا'}
            </span>
          </div>
        `;

        // Get permissions
        const { data: permissions, error: permError } = await supabase
          .from('admin_module_permissions')
          .select('*')
          .eq('admin_phone', TEST_PHONE)
          .eq('is_active', true);

        if (permError) throw permError;

        // Display DB permissions
        let permHtml = '';
        if (!permissions || permissions.length === 0) {
          permHtml = '<div class="test-row"><span class="error">❌ لا توجد صلاحيات</span></div>';
        } else {
          permissions.forEach(perm => {
            permHtml += `
              <div class="code-block" style="margin-bottom: 10px;">
                <div><span class="highlight">${perm.module_name_ar}</span> (${perm.module_id})</div>
                <div style="margin-top: 8px;">
                  can_view: <span class="${perm.can_view ? 'success' : 'error'}">${perm.can_view ? '✅ true' : '❌ false'}</span> |
                  can_create: <span class="${perm.can_create ? 'success' : 'error'}">${perm.can_create ? '✅ true' : '❌ false'}</span> |
                  can_edit: <span class="${perm.can_edit ? 'success' : 'error'}">${perm.can_edit ? '✅ true' : '❌ false'}</span> |
                  can_delete: <span class="${perm.can_delete ? 'success' : 'error'}">${perm.can_delete ? '✅ true' : '❌ false'}</span>
                </div>
              </div>
            `;
          });
        }
        document.getElementById('db-permissions').innerHTML = permHtml;

        // Test hasPermission function
        const tests = [
          { module: 'reservations', action: 'view' },
          { module: 'reservations', action: 'edit' },
          { module: 'reservations', action: 'delete' },
          { module: 'reservations', action: 'create' },
          { module: 'documentation', action: 'edit' },
          { module: 'documentation', action: 'delete' },
          { module: 'finance', action: 'edit' },
        ];

        let testHtml = '';
        tests.forEach(test => {
          const result = testHasPermission(isSuperAdmin, permissions, test.module, test.action);
          testHtml += `
            <div class="test-row">
              <span class="test-label">hasPermission('${test.module}', '${test.action}')</span>
              <span class="test-result ${result ? 'result-true' : 'result-false'}">
                ${result ? '✅ true' : '❌ false'}
              </span>
            </div>
          `;
        });
        document.getElementById('permission-tests').innerHTML = testHtml;

        // Final result
        const canEdit = isSuperAdmin || testHasPermission(isSuperAdmin, permissions, 'reservations', 'edit');
        const canDelete = isSuperAdmin || testHasPermission(isSuperAdmin, permissions, 'reservations', 'delete');
        const canCreate = isSuperAdmin || testHasPermission(isSuperAdmin, permissions, 'reservations', 'create');

        document.getElementById('final-result').innerHTML = `
          <div class="code-block">
            <div style="font-size: 16px; margin-bottom: 15px; color: #4ecca3;">
              🎯 النتيجة النهائية في BookingDetailsPanel:
            </div>
            <div style="margin-bottom: 10px;">
              const canEdit = isAdmin || hasPermission('reservations', 'edit');
              <div style="margin-right: 20px;">→ <span class="${canEdit ? 'error' : 'success'}">${canEdit ? '✅ true ⚠️' : '❌ false ✅'}</span></div>
            </div>
            <div style="margin-bottom: 10px;">
              const canDelete = isAdmin || hasPermission('reservations', 'delete');
              <div style="margin-right: 20px;">→ <span class="${canDelete ? 'error' : 'success'}">${canDelete ? '✅ true ⚠️' : '❌ false ✅'}</span></div>
            </div>
            <div style="margin-bottom: 10px;">
              const canCreate = isAdmin || hasPermission('reservations', 'create');
              <div style="margin-right: 20px;">→ <span class="${canCreate ? 'error' : 'success'}">${canCreate ? '✅ true ⚠️' : '❌ false ✅'}</span></div>
            </div>
            <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid #4ecca3;">
              ${!canEdit && !canDelete && !canCreate
                ? '<div class="success" style="font-size: 18px;">✅✅✅ ممتاز! جميع الصلاحيات false - الأزرار يجب أن تكون مخفية!</div>'
                : '<div class="error" style="font-size: 18px;">❌❌❌ خطأ! بعض الصلاحيات true - الأزرار ستظهر بالخطأ!</div>'
              }
            </div>
          </div>
        `;

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('final-result').innerHTML = `
          <div class="error">❌ حدث خطأ: ${error.message}</div>
        `;
      }
    }

    runTests();
  </script>
</body>
</html>
