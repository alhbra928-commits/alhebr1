<!DOCTYPE html>
<html dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>اختبار الطلبات المعلقة</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 1200px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 20px;
      margin: 20px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      border-radius: 12px;
      margin-bottom: 30px;
    }
    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
    }
    .pending { background: #fef3c7; color: #92400e; }
    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin: 15px 0;
    }
    .info-item {
      background: #f9fafb;
      padding: 12px;
      border-radius: 8px;
    }
    .label {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    .value {
      font-weight: bold;
      color: #111827;
    }
    button {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin: 5px;
    }
    .approve { background: #10b981; color: white; }
    .reject { background: #ef4444; color: white; }
    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔍 اختبار الطلبات المعلقة</h1>
    <p>فحص البيانات المرفوعة من أصحاب المزارع</p>
  </div>

  <div id="result"></div>

  <script type="module">
    const { createClient } = supabase;

    // قراءة بيانات الاتصال من .env
    const SUPABASE_URL = 'https://wvndvunntfyobxggnqvv.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2bmR2dW5udGZ5b2J4Z2ducXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjk0MTgyNjMsImV4cCI6MjA0NDk5NDI2M30.W7bH-VpvLbLg-AoBNiYOSyeJ4gXw8DdG1p43HGVjKM0';

    const client = createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadPendingSubmissions() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = '<div class="loading">⏳ جارٍ التحميل...</div>';

      try {
        const { data, error } = await client
          .from('farm_submission_requests')
          .select(`
            id,
            profile_id,
            status,
            submitted_data,
            varieties_data,
            submitted_at,
            rejection_reason,
            farm_owner_profiles (
              mobile_number,
              full_name,
              national_id,
              region,
              city
            )
          `)
          .eq('status', 'pending')
          .is('deleted_at', null)
          .order('submitted_at', { ascending: false });

        if (error) {
          resultDiv.innerHTML = `
            <div class="card" style="background: #fee2e2; color: #991b1b;">
              <h3>❌ خطأ في جلب البيانات</h3>
              <pre>${JSON.stringify(error, null, 2)}</pre>
            </div>
          `;
          return;
        }

        if (!data || data.length === 0) {
          resultDiv.innerHTML = `
            <div class="card" style="text-align: center; padding: 60px;">
              <h2>📝</h2>
              <h3>لا توجد طلبات معلقة</h3>
            </div>
          `;
          return;
        }

        resultDiv.innerHTML = `
          <div class="card" style="background: #d1fae5; color: #065f46; margin-bottom: 20px;">
            <h3>✅ تم العثور على ${data.length} طلب معلق</h3>
          </div>
          ${data.map(submission => `
            <div class="card">
              <div style="display: flex; justify-content: space-between; align-items: start; margin-bottom: 20px;">
                <div>
                  <h2 style="margin: 0 0 10px 0;">${submission.submitted_data?.full_name || submission.farm_owner_profiles?.full_name || 'غير معروف'}</h2>
                  <span class="status pending">⏳ قيد المراجعة</span>
                  <span style="margin-right: 10px; color: #6b7280;">${submission.submitted_data?.farm_type || 'غير محدد'}</span>
                </div>
                <div style="text-align: left; color: #6b7280; font-size: 14px;">
                  ${new Date(submission.submitted_at).toLocaleString('ar-SA')}
                </div>
              </div>

              <div class="info-grid">
                <div class="info-item">
                  <div class="label">📱 الجوال</div>
                  <div class="value">${submission.farm_owner_profiles?.mobile_number || 'غير متوفر'}</div>
                </div>
                <div class="info-item">
                  <div class="label">📍 المنطقة</div>
                  <div class="value">${submission.submitted_data?.region || 'غير محدد'}</div>
                </div>
                <div class="info-item">
                  <div class="label">🏙️ المدينة</div>
                  <div class="value">${submission.submitted_data?.city || 'غير محدد'}</div>
                </div>
                <div class="info-item">
                  <div class="label">📏 المساحة</div>
                  <div class="value">${submission.submitted_data?.total_farm_area?.toLocaleString('ar-SA')} ${submission.submitted_data?.farm_area_unit}</div>
                </div>
                <div class="info-item">
                  <div class="label">💰 السعر الإجمالي</div>
                  <div class="value" style="color: #10b981;">${submission.submitted_data?.actual_total_price?.toLocaleString('ar-SA')} ريال</div>
                </div>
                <div class="info-item">
                  <div class="label">🌳 عدد الأشجار</div>
                  <div class="value">${submission.submitted_data?.total_trees?.toLocaleString('ar-SA')}</div>
                </div>
              </div>

              ${submission.varieties_data && submission.varieties_data.length > 0 ? `
                <div style="background: #f0fdf4; padding: 15px; border-radius: 8px; margin-top: 15px;">
                  <div class="label" style="margin-bottom: 10px;">🌱 الأصناف:</div>
                  <div style="display: flex; flex-wrap: wrap; gap: 8px;">
                    ${submission.varieties_data.map(v => `
                      <span style="background: white; padding: 8px 12px; border-radius: 6px; font-size: 14px;">
                        ${v.name}: <strong>${v.count}</strong> شجرة
                      </span>
                    `).join('')}
                  </div>
                </div>
              ` : ''}

              <div style="margin-top: 20px; padding-top: 20px; border-top: 2px solid #f3f4f6;">
                <strong>معرف الطلب:</strong> <code>${submission.id}</code>
              </div>
            </div>
          `).join('')}
        `;

      } catch (err) {
        resultDiv.innerHTML = `
          <div class="card" style="background: #fee2e2; color: #991b1b;">
            <h3>❌ خطأ غير متوقع</h3>
            <pre>${err.message}</pre>
          </div>
        `;
      }
    }

    // تحميل البيانات عند فتح الصفحة
    loadPendingSubmissions();
  </script>
</body>
</html>
