<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار لوحة التحكم المالية</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #1a3a2e 0%, #2c5f4f 100%);
      color: white;
      padding: 20px;
      direction: rtl;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      margin: 20px 0;
      border: 2px solid rgba(200, 155, 60, 0.3);
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }
    .stat-card {
      background: linear-gradient(135deg, rgba(16, 185, 129, 0.2) 0%, rgba(5, 150, 105, 0.2) 100%);
      padding: 20px;
      border-radius: 15px;
      border: 2px solid rgba(16, 185, 129, 0.3);
    }
    .stat-value {
      font-size: 32px;
      font-weight: bold;
      color: #10b981;
      margin: 10px 0;
    }
    .stat-label {
      font-size: 14px;
      color: #d1fae5;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
    .warning { color: #f59e0b; }
    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 10px;
      color: #C89B3C;
    }
    .status {
      text-align: center;
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      font-weight: bold;
    }
    pre {
      background: rgba(0, 0, 0, 0.3);
      padding: 15px;
      border-radius: 10px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 اختبار النظام المالي في لوحة التحكم</h1>

    <div id="status" class="status">جاري التحميل...</div>

    <div class="card">
      <h2>📊 الإحصائيات المالية</h2>
      <div class="stats-grid" id="financialStats">
        <!-- سيتم ملؤها بواسطة JavaScript -->
      </div>
    </div>

    <div class="card">
      <h2>💰 تفاصيل الإيرادات</h2>
      <div id="revenueDetails">
        <!-- سيتم ملؤها بواسطة JavaScript -->
      </div>
    </div>

    <div class="card">
      <h2>🔍 البيانات الأولية (من قاعدة البيانات)</h2>
      <pre id="rawData"></pre>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ptnlfutzuyplohksfpxm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0bmxmdXR6dXlwbG9oa3NmcHhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg5Nzg0NzQsImV4cCI6MjA0NDU1NDQ3NH0.uYYq4QOwc9_0JuGMtD6ZxdO00v5rrlHfIE82dTWE64s';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function testFinancialDashboard() {
      try {
        document.getElementById('status').innerHTML = '<span class="warning">⏳ جاري جلب البيانات...</span>';

        // 1. جلب الحجوزات المكتملة
        const { data: reservations, error: resError } = await supabase
          .from('reservations')
          .select('total_amount, payment_status, booking_status')
          .eq('payment_status', 'completed')
          .is('deleted_at', null);

        if (resError) throw resError;

        // 2. حساب إجمالي الإيرادات
        const totalRevenue = reservations.reduce((sum, r) => sum + (Number(r.total_amount) || 0), 0);

        // 3. جلب smart_farm_finances
        const { data: finances, error: finError } = await supabase
          .from('smart_farm_finances')
          .select('*')
          .is('deleted_at', null);

        const financialStats = finances?.reduce((acc, finance) => ({
          totalRevenue: acc.totalRevenue + (Number(finance.total_revenue_collected) || 0),
          platformProfit: acc.platformProfit + (Number(finance.platform_profit) || 0),
          charityAmount: acc.charityAmount + (Number(finance.charity_amount) || 0),
          netProfit: acc.netProfit + (Number(finance.net_platform_profit) || 0),
        }), { totalRevenue: 0, platformProfit: 0, charityAmount: 0, netProfit: 0 }) || {};

        // 4. الإيرادات الفعلية
        const actualTotalRevenue = Math.max(totalRevenue, financialStats.totalRevenue || 0);

        // 5. عرض النتائج
        document.getElementById('financialStats').innerHTML = `
          <div class="stat-card">
            <div class="stat-label">إجمالي الإيرادات (من الحجوزات)</div>
            <div class="stat-value">${totalRevenue.toLocaleString('ar-SA')} ريال</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">إجمالي الإيرادات (من smart_farm_finances)</div>
            <div class="stat-value">${(financialStats.totalRevenue || 0).toLocaleString('ar-SA')} ريال</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">الإيرادات الفعلية المستخدمة</div>
            <div class="stat-value" style="color: #C89B3C;">${actualTotalRevenue.toLocaleString('ar-SA')} ريال</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">عدد الحجوزات المكتملة</div>
            <div class="stat-value">${reservations.length}</div>
          </div>
        `;

        const platformProfit = financialStats.platformProfit || (actualTotalRevenue * 0.05);
        const netProfit = financialStats.netProfit || (actualTotalRevenue * 0.045);
        const charityAmount = financialStats.charityAmount || (actualTotalRevenue * 0.005);

        document.getElementById('revenueDetails').innerHTML = `
          <div class="stats-grid">
            <div class="stat-card">
              <div class="stat-label">🏦 أرباح المنصة (5%)</div>
              <div class="stat-value">${platformProfit.toLocaleString('ar-SA')} ريال</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">💎 صافي الربح (4.5%)</div>
              <div class="stat-value">${netProfit.toLocaleString('ar-SA')} ريال</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">❤️ الصدقات (0.5%)</div>
              <div class="stat-value">${charityAmount.toLocaleString('ar-SA')} ريال</div>
            </div>
          </div>
        `;

        document.getElementById('rawData').textContent = JSON.stringify({
          reservations_count: reservations.length,
          finances_count: finances?.length || 0,
          totalRevenue,
          financialStats,
          actualTotalRevenue,
          sample_reservations: reservations.slice(0, 3)
        }, null, 2);

        document.getElementById('status').innerHTML = '<span class="success">✅ تم جلب البيانات المالية بنجاح!</span>';

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').innerHTML = `<span class="error">❌ خطأ: ${error.message}</span>`;
        document.getElementById('rawData').textContent = error.stack;
      }
    }

    // تشغيل الاختبار عند تحميل الصفحة
    testFinancialDashboard();
  </script>
</body>
</html>
