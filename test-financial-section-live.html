<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار قسم المالية - مباشر</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
      color: white;
      padding: 20px;
      direction: rtl;
      min-height: 100vh;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
      padding: 30px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 2px solid rgba(200, 155, 60, 0.3);
    }

    .header h1 {
      font-size: 48px;
      color: #C89B3C;
      margin-bottom: 10px;
      text-shadow: 0 0 20px rgba(200, 155, 60, 0.5);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      padding: 30px;
      border-radius: 20px;
      border: 2px solid;
      position: relative;
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .stat-card.ready {
      background: linear-gradient(135deg, rgba(234, 179, 8, 0.2) 0%, rgba(251, 191, 36, 0.2) 100%);
      border-color: #eab308;
    }

    .stat-card.settled {
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.2) 0%, rgba(16, 185, 129, 0.2) 100%);
      border-color: #10b981;
    }

    .stat-card.collecting {
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.2) 0%, rgba(37, 99, 235, 0.2) 100%);
      border-color: #3b82f6;
    }

    .stat-card.total {
      background: linear-gradient(135deg, rgba(168, 85, 247, 0.2) 0%, rgba(147, 51, 234, 0.2) 100%);
      border-color: #a855f7;
    }

    .stat-icon {
      font-size: 40px;
      margin-bottom: 15px;
    }

    .stat-label {
      font-size: 14px;
      opacity: 0.8;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 48px;
      font-weight: bold;
      line-height: 1;
    }

    .farm-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 40px;
      border: 3px solid rgba(200, 155, 60, 0.3);
      margin-bottom: 30px;
      transition: transform 0.3s, box-shadow 0.3s;
      position: relative;
      overflow: hidden;
    }

    .farm-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #C89B3C, #10b981, #3b82f6, #C89B3C);
      background-size: 200% 100%;
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .farm-card:hover {
      transform: scale(1.02);
      box-shadow: 0 30px 60px rgba(200, 155, 60, 0.3);
    }

    .farm-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.1);
    }

    .farm-title {
      font-size: 32px;
      color: #C89B3C;
      font-weight: bold;
    }

    .farm-code {
      font-size: 18px;
      color: #10b981;
      font-family: monospace;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.2);
      border-radius: 10px;
    }

    .financial-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .financial-item {
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }

    .financial-label {
      font-size: 14px;
      opacity: 0.7;
      margin-bottom: 10px;
    }

    .financial-value {
      font-size: 28px;
      font-weight: bold;
      color: #10b981;
    }

    .progress-bar {
      width: 100%;
      height: 30px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      overflow: hidden;
      margin: 20px 0;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
      font-size: 14px;
      transition: width 1s ease-out;
    }

    .badge {
      display: inline-block;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin: 5px;
    }

    .badge.ready {
      background: linear-gradient(135deg, #eab308, #f59e0b);
      color: white;
    }

    .badge.settled {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }

    .success { color: #10b981; }
    .error { color: #ef4444; }
    .warning { color: #f59e0b; }

    .status-box {
      padding: 20px;
      border-radius: 15px;
      margin: 20px 0;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .status-box.loading {
      background: rgba(59, 130, 246, 0.2);
      border: 2px solid #3b82f6;
      color: #3b82f6;
    }

    .status-box.success {
      background: rgba(16, 185, 129, 0.2);
      border: 2px solid #10b981;
      color: #10b981;
    }

    .status-box.error {
      background: rgba(239, 68, 68, 0.2);
      border: 2px solid #ef4444;
      color: #ef4444;
    }

    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-left: 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    pre {
      background: rgba(0, 0, 0, 0.5);
      padding: 20px;
      border-radius: 15px;
      overflow-x: auto;
      font-size: 13px;
      margin-top: 20px;
      border: 2px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎯 اختبار قسم المالية المباشر</h1>
      <p style="font-size: 18px; margin-top: 10px; opacity: 0.9;">
        عرض حي لجميع البيانات المالية من قاعدة البيانات
      </p>
    </div>

    <div id="status" class="status-box loading">
      جاري تحميل البيانات المالية<span class="loading-spinner"></span>
    </div>

    <div id="statsGrid" class="stats-grid"></div>
    <div id="farmCards"></div>
    <div id="rawData"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ptnlfutzuyplohksfpxm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB0bmxmdXR6dXlwbG9oa3NmcHhtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Mjg5Nzg0NzQsImV4cCI6MjA0NDU1NDQ3NH0.uYYq4QOwc9_0JuGMtD6ZxdxdO00v5rrlHfIE82dTWE64s';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function formatCurrency(amount) {
      return new Intl.NumberFormat('ar-SA').format(Math.round(amount));
    }

    async function loadFinancialData() {
      try {
        // جلب البيانات من farm_finance
        const { data: farms, error: farmsError } = await supabase
          .from('farm_finance')
          .select('*')
          .is('deleted_at', null)
          .order('updated_at', { ascending: false });

        if (farmsError) throw farmsError;

        // حساب الإحصائيات
        const stats = {
          ready: farms.filter(f => f.stage === 'ready_for_settlement').length,
          settled: farms.filter(f => f.settlement_executed).length,
          collecting: farms.filter(f => f.stage === 'collecting').length,
          total: farms.length
        };

        // عرض الإحصائيات
        document.getElementById('statsGrid').innerHTML = `
          <div class="stat-card ready">
            <div class="stat-icon">⚡</div>
            <div class="stat-label">جاهز للتسوية</div>
            <div class="stat-value">${stats.ready}</div>
          </div>
          <div class="stat-card settled">
            <div class="stat-icon">✅</div>
            <div class="stat-label">تمت التسوية</div>
            <div class="stat-value">${stats.settled}</div>
          </div>
          <div class="stat-card collecting">
            <div class="stat-icon">🏗️</div>
            <div class="stat-label">قيد التجميع</div>
            <div class="stat-value">${stats.collecting}</div>
          </div>
          <div class="stat-card total">
            <div class="stat-icon">👥</div>
            <div class="stat-label">إجمالي المزارع</div>
            <div class="stat-value">${stats.total}</div>
          </div>
        `;

        // عرض بطاقات المزارع
        if (farms.length === 0) {
          document.getElementById('farmCards').innerHTML = `
            <div class="farm-card">
              <div style="text-align: center; padding: 40px;">
                <div style="font-size: 64px; margin-bottom: 20px;">🏛️</div>
                <h3 style="font-size: 24px; margin-bottom: 10px;">لا توجد مزارع في النظام المالي</h3>
                <p style="opacity: 0.7;">لم يتم إنشاء أي سجل مالي بعد</p>
              </div>
            </div>
          `;
        } else {
          document.getElementById('farmCards').innerHTML = farms.map(farm => {
            const completionPercent = farm.owner_amount_target > 0
              ? (farm.collected_from_investors / farm.owner_amount_target * 100).toFixed(2)
              : 0;

            return `
              <div class="farm-card">
                <div class="farm-header">
                  <div class="farm-title">🏛️ ${farm.farm_name}</div>
                  <div class="farm-code">${farm.farm_code}</div>
                </div>

                ${farm.settlement_ready ? '<span class="badge ready">⚡ جاهز للتسوية</span>' : ''}
                ${farm.settlement_executed ? '<span class="badge settled">✅ تمت التسوية</span>' : ''}

                <div class="financial-grid">
                  <div class="financial-item">
                    <div class="financial-label">💰 المبلغ المجموع</div>
                    <div class="financial-value">${formatCurrency(farm.collected_from_investors)} ريال</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">🎯 المبلغ المستهدف</div>
                    <div class="financial-value">${formatCurrency(farm.owner_amount_target)} ريال</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">👥 عدد المستثمرين</div>
                    <div class="financial-value">${farm.total_investors}</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">🌳 الأشجار المباعة</div>
                    <div class="financial-value">${formatCurrency(farm.total_trees_sold)}</div>
                  </div>
                </div>

                <div>
                  <div class="financial-label">📊 نسبة الإنجاز المالي</div>
                  <div class="progress-bar">
                    <div class="progress-fill" style="width: ${Math.min(completionPercent, 100)}%">
                      ${completionPercent}%
                    </div>
                  </div>
                </div>

                <div class="financial-grid" style="margin-top: 30px;">
                  <div class="financial-item">
                    <div class="financial-label">💵 المحول لصاحب المزرعة</div>
                    <div class="financial-value">${formatCurrency(farm.owner_amount_transferred)} ريال</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">🏦 أرباح المنصة</div>
                    <div class="financial-value">${formatCurrency(farm.platform_amount_received)} ريال</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">❤️ الصدقات</div>
                    <div class="financial-value">${formatCurrency(farm.charity_amount_deducted)} ريال</div>
                  </div>
                  <div class="financial-item">
                    <div class="financial-label">📋 الحالة</div>
                    <div class="financial-value" style="font-size: 18px;">
                      ${farm.stage === 'collecting' ? '🏗️ قيد التجميع' :
                        farm.stage === 'ready_for_settlement' ? '⚡ جاهز للتسوية' :
                        farm.stage === 'completed' ? '✅ مكتمل' : farm.stage}
                    </div>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }

        // عرض البيانات الخام
        document.getElementById('rawData').innerHTML = `
          <pre>${JSON.stringify({ stats, farms }, null, 2)}</pre>
        `;

        document.getElementById('status').className = 'status-box success';
        document.getElementById('status').innerHTML = '✅ تم تحميل البيانات المالية بنجاح!';

      } catch (error) {
        console.error('Error:', error);
        document.getElementById('status').className = 'status-box error';
        document.getElementById('status').innerHTML = `❌ خطأ: ${error.message}`;
        document.getElementById('rawData').innerHTML = `<pre>${error.stack}</pre>`;
      }
    }

    // تحميل البيانات عند فتح الصفحة
    loadFinancialData();
  </script>
</body>
</html>
