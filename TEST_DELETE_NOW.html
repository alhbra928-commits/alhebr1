<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار الحذف الفعلي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a4d2e 0%, #2C5F2D 100%);
            min-height: 100vh;
            padding: 40px 20px;
            color: white;
        }
        .container { max-width: 900px; margin: 0 auto; }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #D4AF37;
            text-shadow: 0 0 20px rgba(212, 175, 55, 0.5);
        }
        .test-box {
            background: rgba(44, 95, 45, 0.8);
            border: 3px solid rgba(212, 175, 55, 0.5);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
        }
        .test-box h2 {
            color: #D4AF37;
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .button {
            background: linear-gradient(135deg, #D4AF37, #C49423);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            transition: all 0.3s;
        }
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }
        .button.delete {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        .activity-item {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .activity-info {
            flex: 1;
        }
        .activity-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #F5F5DC;
            margin-bottom: 5px;
        }
        .activity-meta {
            font-size: 0.9rem;
            color: #D4AF37;
        }
        .log {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-family: 'Courier New', monospace;
            color: #D4AF37;
            max-height: 300px;
            overflow-y: auto;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .success { color: #22c55e; }
        .error { color: #ef4444; }
        .info { color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 اختبار الحذف الفعلي للشريط</h1>

        <div class="test-box">
            <h2>📊 الأنشطة الحالية</h2>
            <div id="activities"></div>
            <button class="button" onclick="loadActivities()">🔄 تحديث القائمة</button>
            <button class="button" onclick="addTestActivity()">➕ إضافة نشاط تجريبي</button>
        </div>

        <div class="test-box">
            <h2>📝 سجل الأحداث</h2>
            <div id="log"></div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://bhtihsrrhlumgpwbgrei.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJodGloc3JyaGx1bWdwd2JncmVpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjkzNDY2NjcsImV4cCI6MjA0NDkyMjY2N30.HUck1hLx32VWzz_5ZqWlhmV_OGGCJgNc5a-CQ7lHoJk';

        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const timestamp = new Date().toLocaleTimeString('ar-SA');
            const color = type === 'success' ? 'success' : type === 'error' ? 'error' : 'info';
            logDiv.innerHTML += `<div class="${color}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(`[${type}] ${message}`);
        }

        async function loadActivities() {
            log('🔍 جاري تحميل الأنشطة...', 'info');
            try {
                const { data, error } = await supabase
                    .from('platform_activities')
                    .select('*')
                    .is('deleted_at', null)
                    .order('created_at', { ascending: false });

                if (error) {
                    log(`❌ خطأ في التحميل: ${error.message}`, 'error');
                    return;
                }

                log(`✅ تم تحميل ${data.length} نشاط`, 'success');
                displayActivities(data);
            } catch (err) {
                log(`❌ خطأ: ${err.message}`, 'error');
            }
        }

        function displayActivities(activities) {
            const container = document.getElementById('activities');
            if (activities.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #D4AF37; font-size: 1.2rem;">لا توجد أنشطة</p>';
                return;
            }

            container.innerHTML = activities.map(activity => `
                <div class="activity-item">
                    <div class="activity-info">
                        <div class="activity-title">
                            ${activity.activity_data?.icon || '✨'}
                            ${activity.activity_data?.title_ar || 'نشاط'}
                        </div>
                        <div class="activity-meta">
                            ID: ${activity.id.substring(0, 8)}... |
                            الأولوية: ${activity.priority} |
                            ${activity.is_active ? '✅ نشط' : '⏸️ متوقف'}
                        </div>
                    </div>
                    <button class="button delete" onclick="deleteActivity('${activity.id}')">
                        🗑️ حذف
                    </button>
                </div>
            `).join('');
        }

        async function deleteActivity(id) {
            const shortId = id.substring(0, 8);
            log(`🗑️ محاولة حذف النشاط ${shortId}...`, 'info');

            try {
                // محاولة الحذف المباشر
                const { error, data } = await supabase
                    .from('platform_activities')
                    .delete()
                    .eq('id', id)
                    .select();

                if (error) {
                    log(`❌ فشل الحذف: ${error.message}`, 'error');
                    log(`❌ التفاصيل: ${JSON.stringify(error)}`, 'error');
                    return;
                }

                log(`✅ تم الحذف بنجاح! النشاط ${shortId} تم إزالته فعلياً`, 'success');

                // التحقق من الحذف
                const { data: checkData, error: checkError } = await supabase
                    .from('platform_activities')
                    .select('id')
                    .eq('id', id)
                    .maybeSingle();

                if (checkError) {
                    log(`⚠️ خطأ في التحقق: ${checkError.message}`, 'error');
                } else if (!checkData) {
                    log(`✅ تأكيد: النشاط ${shortId} غير موجود في قاعدة البيانات`, 'success');
                } else {
                    log(`⚠️ تحذير: النشاط ${shortId} ما زال موجوداً!`, 'error');
                }

                // إعادة تحميل القائمة
                await loadActivities();
            } catch (err) {
                log(`❌ خطأ غير متوقع: ${err.message}`, 'error');
            }
        }

        async function addTestActivity() {
            log('➕ إضافة نشاط تجريبي...', 'info');
            try {
                const { data, error } = await supabase
                    .from('platform_activities')
                    .insert({
                        activity_type: 'test',
                        activity_data: {
                            title_ar: `نشاط تجريبي ${new Date().getTime()}`,
                            title_en: `Test Activity ${new Date().getTime()}`,
                            icon: '🧪'
                        },
                        priority: 5,
                        is_active: true
                    })
                    .select();

                if (error) {
                    log(`❌ فشلت الإضافة: ${error.message}`, 'error');
                    return;
                }

                log(`✅ تم إضافة نشاط تجريبي بنجاح`, 'success');
                await loadActivities();
            } catch (err) {
                log(`❌ خطأ: ${err.message}`, 'error');
            }
        }

        // تحميل الأنشطة عند فتح الصفحة
        window.onload = () => {
            log('🚀 تم تحميل صفحة الاختبار', 'success');
            log('🔗 الاتصال بـ Supabase...', 'info');
            loadActivities();
        };
    </script>
</body>
</html>
