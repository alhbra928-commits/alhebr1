<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />

    <!-- ULTRA AGGRESSIVE CACHE PREVENTION FOR CDN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, s-maxage=0, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta name="expires" content="-1" />
    <meta name="pragma" content="no-cache" />
    <meta name="last-modified" content="__BUILD_VERSION__" />
    <meta name="version" content="__BUILD_VERSION__" />
    <meta name="cache-buster" content="v20251209_1765287919907" />

    <!-- iPhone/Safari specific headers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>

    <!-- 🎯 ULTIMATE STRUCTURE: Footer خارج body تماماً -->
    <style>
      /* CRITICAL: منع Safari من تغيير ارتفاع viewport */
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        /* استخدام CSS Variable بدلاً من 100% */
        height: 100vh;
        height: calc(var(--vh, 1vh) * 100);
        overflow: hidden !important; /* NO SCROLL on html/body */
        position: relative;
        -webkit-overflow-scrolling: auto;
      }

      /* Scroll Container للمحتوى */
      #root {
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
        -webkit-overflow-scrolling: touch;
        position: relative;
        padding-bottom: max(90px, calc(90px + env(safe-area-inset-bottom)));
      }

      /* Global Bottom Dock - خارج body تماماً */
      #global-bottom-dock {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        width: 100% !important;
        z-index: 999999 !important;

        /* Force GPU Layer */
        transform: translate3d(0, 0, 0) !important;
        -webkit-transform: translate3d(0, 0, 0) !important;
        -webkit-backface-visibility: hidden !important;
        backface-visibility: hidden !important;
        will-change: transform !important;

        /* منع أي تأثير من Safari */
        pointer-events: auto !important;
        touch-action: manipulation !important;
      }

      /* iOS Safari Specific */
      @supports (-webkit-touch-callout: none) {
        html, body {
          overflow: hidden !important;
          height: calc(var(--vh, 1vh) * 100) !important;
          position: fixed !important;
          width: 100% !important;
        }

        #root {
          position: absolute !important;
          top: 0 !important;
          left: 0 !important;
          right: 0 !important;
          bottom: 0 !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
        }

        #global-bottom-dock {
          position: fixed !important;
          /* visualViewport API + CSS Variables = LOCKED */
          bottom: var(--footer-bottom, 0) !important;
        }
      }
    </style>

    <!-- 🔄 AGGRESSIVE CACHE BUSTING FOR IPHONE -->
    <script>
      (function() {
        const BUILD_VERSION = '__BUILD_VERSION__';
        const FORCE_UPDATE_VERSION = 'v20251209_GLOBAL_DOCK_OUTSIDE_BODY';

        console.log('%c✅ منصة النخيل والزيتون', 'color:#10b981;font-size:18px;font-weight:bold');
        console.log('Version:', BUILD_VERSION);
        console.log('Force Update:', FORCE_UPDATE_VERSION);

        // Check if this is iPhone/iPad
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isSafari = /Safari/i.test(navigator.userAgent) && !/Chrome/i.test(navigator.userAgent);

        if (isIOS || isSafari) {
          console.log('📱 iPhone/iPad detected - Checking for updates...');

          const lastForceUpdate = localStorage.getItem('force-update-version');
          const lastAppVersion = localStorage.getItem('app-version');

          // Force reload if versions don't match
          if (lastForceUpdate !== FORCE_UPDATE_VERSION || lastAppVersion !== BUILD_VERSION) {
            console.log('🔄 New version detected - Force reloading...');

            // Clear all possible caches
            if ('caches' in window) {
              caches.keys().then(names => {
                names.forEach(name => caches.delete(name));
              });
            }

            // Store new versions
            localStorage.setItem('force-update-version', FORCE_UPDATE_VERSION);
            localStorage.setItem('app-version', BUILD_VERSION);

            // Force hard reload with cache bypass
            setTimeout(() => {
              window.location.reload(true);
            }, 100);
          } else {
            console.log('✅ Already on latest version');
          }
        } else {
          // Non-iOS: just save version
          localStorage.setItem('app-version', BUILD_VERSION);
        }
      })();
    </script>

    <!-- 🎯 ULTIMATE SAFARI iOS FIX: visualViewport + CSS Variables -->
    <script>
      (function() {
        // تثبيت ارتفاع viewport باستخدام CSS Variables
        function setViewportHeight() {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', vh + 'px');

          // إضافة safe-area للدعم الكامل
          const safeAreaBottom = getComputedStyle(document.documentElement)
            .getPropertyValue('--safe-area-inset-bottom') || '0px';
          document.documentElement.style.setProperty('--sab', safeAreaBottom);
        }

        // تحديث عند التحميل
        setViewportHeight();

        // تحديث عند تدوير الشاشة فقط (ليس عند scroll)
        window.addEventListener('orientationchange', function() {
          setTimeout(setViewportHeight, 100);
        });

        // تحديث عند resize حقيقي (تغيير حجم نافذة المتصفح)
        let resizeTimer;
        window.addEventListener('resize', function() {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(function() {
            // تحديث فقط إذا تغير العرض (يعني دوران حقيقي)
            const currentWidth = window.innerWidth;
            const savedWidth = parseInt(localStorage.getItem('vp-width') || '0');

            if (Math.abs(currentWidth - savedWidth) > 50) {
              setViewportHeight();
              localStorage.setItem('vp-width', currentWidth);
            }
          }, 150);
        });

        // حفظ العرض الحالي
        localStorage.setItem('vp-width', window.innerWidth);

        console.log('✅ Viewport height locked:', document.documentElement.style.getPropertyValue('--vh'));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

  <!-- 🎯 Global Bottom Dock - خارج body تماماً -->
  <div id="global-bottom-dock"></div>
</html>
