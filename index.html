<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta name="expires" content="0" />
    <meta name="pragma" content="no-cache" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // PROFESSIONAL CACHE BUSTING SYSTEM - DARK THEME v3
      (function() {
        const BUILD_TIMESTAMP = Date.now(); // Will be replaced during build
        const CURRENT_VERSION = 'DARK_THEME_v3_' + BUILD_TIMESTAMP;
        const stored = localStorage.getItem('app-version');

        // Disable back-forward cache (bfcache)
        window.addEventListener('pageshow', function(event) {
          if (event.persisted) {
            console.log('%c🔄 BFCache detected - forcing reload', 'color:orange;font-size:16px');
            window.location.reload();
          }
        });

        console.log('%c🔍 PROFESSIONAL CACHE CHECK', 'color:blue;font-size:20px;font-weight:bold');
        console.log('Build:', BUILD_TIMESTAMP);
        console.log('Current Version:', CURRENT_VERSION);
        console.log('Stored Version:', stored);

        if (stored !== CURRENT_VERSION) {
          console.log('%c🔥 NEW VERSION DETECTED - CLEARING ALL CACHE', 'color:red;font-size:24px;font-weight:bold');
          console.log('%c⚠️ سيتم حذف كل الـ cache القديم وإعادة التحميل', 'color:orange;font-size:18px');

          // Preserve authentication data
          const authData = {};
          const authKeys = [
            'admin_session_token',
            'admin_data',
            'investor_phone',
            'investor_data',
            'farm_owner_session',
            'farm_owner_data'
          ];

          authKeys.forEach(key => {
            const value = localStorage.getItem(key);
            if (value) {
              authData[key] = value;
              console.log('%c💾 Preserving: ' + key, 'color:blue;font-size:14px');
            }
          });

          // Clear all caches aggressively
          (async function clearAllCaches() {
            try {
              // Clear Cache API
              if ('caches' in window) {
                const cacheNames = await caches.keys();
                console.log('%c🗑️ Deleting ' + cacheNames.length + ' cache(s)...', 'color:red;font-size:16px');
                await Promise.all(cacheNames.map(name => {
                  console.log('%c  - Deleting: ' + name, 'color:gray;font-size:12px');
                  return caches.delete(name);
                }));
                console.log('%c✅ All caches deleted', 'color:green;font-size:16px');
              }

              // Unregister all service workers
              if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                console.log('%c🗑️ Unregistering ' + registrations.length + ' service worker(s)...', 'color:red;font-size:16px');
                await Promise.all(registrations.map(reg => {
                  console.log('%c  - Unregistering: ' + reg.scope, 'color:gray;font-size:12px');
                  return reg.unregister();
                }));
                console.log('%c✅ All service workers unregistered', 'color:green;font-size:16px');
              }

              // Clear storage
              console.log('%c🗑️ Clearing localStorage & sessionStorage...', 'color:red;font-size:16px');
              localStorage.clear();
              sessionStorage.clear();

              // Restore authentication data
              Object.keys(authData).forEach(key => {
                localStorage.setItem(key, authData[key]);
                console.log('%c♻️ Restored: ' + key, 'color:green;font-size:14px');
              });

              // Save new version
              localStorage.setItem('app-version', CURRENT_VERSION);
              localStorage.setItem('build-timestamp', BUILD_TIMESTAMP.toString());
              localStorage.setItem('last-cache-clear', new Date().toISOString());

              console.log('%c✅ CACHE CLEARED SUCCESSFULLY', 'color:green;font-size:20px;font-weight:bold');
              console.log('%c🔄 Reloading with fresh content in 1 second...', 'color:blue;font-size:18px');

              // Hard reload with cache bypass
              setTimeout(() => {
                const url = new URL(window.location.href);
                url.searchParams.set('_t', BUILD_TIMESTAMP);
                url.searchParams.set('_cache', 'bypass');
                window.location.replace(url.toString());
              }, 1000);

            } catch (error) {
              console.error('%c❌ Cache clear error:', 'color:red;font-size:16px', error);
              // Force reload anyway
              window.location.reload(true);
            }
          })();
        } else {
          console.log('%c✅ VERSION UP-TO-DATE', 'color:green;font-size:18px;font-weight:bold');
          console.log('%c💎 Dark Theme Active', 'color:#10b981;font-size:16px');

          // Still clear old caches in background (cleanup)
          if ('caches' in window) {
            caches.keys().then(names => {
              names.forEach(name => {
                if (!name.includes(BUILD_TIMESTAMP.toString())) {
                  console.log('%c🧹 Cleaning old cache: ' + name, 'color:gray;font-size:12px');
                  caches.delete(name);
                }
              });
            });
          }
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
