<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />

    <!-- ULTRA AGGRESSIVE CACHE PREVENTION FOR CDN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, s-maxage=0, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta name="expires" content="-1" />
    <meta name="pragma" content="no-cache" />
    <meta name="last-modified" content="__BUILD_VERSION__" />
    <meta name="version" content="__BUILD_VERSION__" />
    <meta name="cache-buster" content="v20251101_1762027821841" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>

    <!-- Instant Splash Screen - Pure CSS, No JS needed -->
    <style>
      /* Splash screen styling */
      #app-splash {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(135deg, #047857 0%, #065f46 50%, #064e3b 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        opacity: 1;
        transition: opacity 0.3s ease-out;
      }

      /* Hide when React loads */
      #app-splash.loaded {
        opacity: 0;
        pointer-events: none;
      }

      /* Crown icon */
      .splash-crown {
        font-size: 96px;
        margin-bottom: 24px;
        animation: bounce 2s ease-in-out infinite;
        filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
      }

      /* Title */
      .splash-title {
        font-size: 36px;
        font-weight: 900;
        background: linear-gradient(135deg, #10b981 0%, #34d399 50%, #6ee7b7 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-align: center;
        margin-bottom: 12px;
        font-family: system-ui, -apple-system, sans-serif;
        padding: 0 20px;
      }

      /* Subtitle */
      .splash-subtitle {
        font-size: 18px;
        color: #10b981;
        text-align: center;
        font-weight: 600;
        margin-bottom: 40px;
        font-family: system-ui, -apple-system, sans-serif;
      }

      /* Spinner */
      .splash-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(16, 185, 129, 0.2);
        border-top-color: #10b981;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      /* Floating particles */
      .splash-particle {
        position: absolute;
        width: 80px;
        height: 80px;
        background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, transparent 70%);
        border-radius: 50%;
        animation: float 4s ease-in-out infinite;
      }

      .splash-particle:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
      .splash-particle:nth-child(2) { top: 20%; right: 15%; animation-delay: 1s; }
      .splash-particle:nth-child(3) { bottom: 15%; left: 20%; animation-delay: 2s; }
      .splash-particle:nth-child(4) { bottom: 10%; right: 10%; animation-delay: 1.5s; }

      @keyframes bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-20px); }
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      @keyframes float {
        0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
        50% { transform: translate(10px, -20px) scale(1.1); opacity: 0.6; }
      }

      /* Mobile responsive */
      @media (max-width: 640px) {
        .splash-crown { font-size: 72px; }
        .splash-title { font-size: 28px; }
        .splash-subtitle { font-size: 16px; }
      }
    </style>

    <!-- ⚛️ SIMPLE VERSION CHECK - NO AUTO RELOAD -->
    <script>
      (function() {
        const BUILD_VERSION = '__BUILD_VERSION__';
        console.log('%c✅ منصة النخيل والزيتون', 'color:#10b981;font-size:18px;font-weight:bold');
        console.log('Version:', BUILD_VERSION);

        // Just save version, don't reload
        localStorage.setItem('app-version', BUILD_VERSION);
      })();
    </script>
  </head>
  <body>
    <!-- Instant Splash Screen - Shows immediately -->
    <div id="app-splash">
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>
      <div class="splash-particle"></div>

      <div class="splash-crown">👑</div>
      <div class="splash-title">منصة النخيل والزيتون</div>
      <div class="splash-subtitle">استثمار راقٍ يثمر خيرًا</div>
      <div class="splash-spinner"></div>
    </div>

    <div id="root"></div>
    
    
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide splash INSTANTLY when React starts -->
    <script>
      // إخفاء فوري عندما يبدأ React
      const splash = document.getElementById('app-splash');
      const root = document.getElementById('root');

      // Check every 50ms - faster detection
      const checkInterval = setInterval(() => {
        if (root && root.children.length > 0) {
          // React بدأ! إخفاء فوري
          splash.classList.add('loaded');
          setTimeout(() => splash.remove(), 400);
          clearInterval(checkInterval);
        }
      }, 50);

      // Fallback: إخفاء بعد 2 ثانية كحد أقصى (أسرع)
      setTimeout(() => {
        splash.classList.add('loaded');
        setTimeout(() => splash.remove(), 400);
        clearInterval(checkInterval);
      }, 2000);
    </script>
  </body>
</html>
