<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />

    <!-- ULTRA AGGRESSIVE CACHE PREVENTION FOR CDN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, s-maxage=0, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta name="expires" content="-1" />
    <meta name="pragma" content="no-cache" />
    <meta name="last-modified" content="__BUILD_VERSION__" />
    <meta name="version" content="__BUILD_VERSION__" />
    <meta name="cache-buster" content="v20251220_1766220865721" />

    <!-- iPhone/Safari specific headers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>

    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="منصة النخيل والزيتون" />
    <meta property="og:title" content="منصة النخيل والزيتون - استثمر في مزارع الزيتون" />
    <meta property="og:description" content="استثمر في مزارع الزيتون المميزة | عوائد مضمونة | ملكية موثقة | فرصة استثمارية مثالية" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1474440692490-2e83ae13ba29?q=80&w=1200" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ar_SA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="منصة النخيل والزيتون - استثمر في مزارع الزيتون" />
    <meta name="twitter:description" content="استثمر في مزارع الزيتون المميزة | عوائد مضمونة | ملكية موثقة" />
    <meta name="twitter:image" content="https://images.unsplash.com/photo-1474440692490-2e83ae13ba29?q=80&w=1200" />

    <!-- WhatsApp specific -->
    <meta property="og:url" content="https://hisas1.com" />
    <meta property="og:image:alt" content="مزارع زيتون للاستثمار" />

    <!-- Basic Reset Only -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }

      /* Animations for Share Modal */
      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translate(-50%, -40%);
        }
        to {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
      }

      @keyframes slideOut {
        from {
          opacity: 1;
          transform: translate(-50%, -50%);
        }
        to {
          opacity: 0;
          transform: translate(-50%, -60%);
        }
      }
    </style>

    <!-- 🔄 AGGRESSIVE CACHE BUSTING FOR IPHONE -->
    <script>
      (function() {
        const BUILD_VERSION = '__BUILD_VERSION__';
        const FORCE_UPDATE_VERSION = 'v20251209_GLOBAL_DOCK_OUTSIDE_BODY';

        console.log('%c✅ منصة النخيل والزيتون', 'color:#10b981;font-size:18px;font-weight:bold');
        console.log('Version:', BUILD_VERSION);
        console.log('Force Update:', FORCE_UPDATE_VERSION);

        // Check if this is iPhone/iPad
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        const isSafari = /Safari/i.test(navigator.userAgent) && !/Chrome/i.test(navigator.userAgent);

        if (isIOS || isSafari) {
          console.log('📱 iPhone/iPad detected - Checking for updates...');

          const lastForceUpdate = localStorage.getItem('force-update-version');
          const lastAppVersion = localStorage.getItem('app-version');

          // Force reload if versions don't match
          if (lastForceUpdate !== FORCE_UPDATE_VERSION || lastAppVersion !== BUILD_VERSION) {
            console.log('🔄 New version detected - Force reloading...');

            // Clear all possible caches
            if ('caches' in window) {
              caches.keys().then(names => {
                names.forEach(name => caches.delete(name));
              });
            }

            // Store new versions
            localStorage.setItem('force-update-version', FORCE_UPDATE_VERSION);
            localStorage.setItem('app-version', BUILD_VERSION);

            // Force hard reload with cache bypass
            setTimeout(() => {
              window.location.reload(true);
            }, 100);
          } else {
            console.log('✅ Already on latest version');
          }
        } else {
          // Non-iOS: just save version
          localStorage.setItem('app-version', BUILD_VERSION);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
