<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#064e3b" />

    <!-- ULTRA AGGRESSIVE CACHE PREVENTION FOR CDN -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, proxy-revalidate, s-maxage=0, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="-1" />
    <meta name="cache-control" content="no-cache, no-store, must-revalidate" />
    <meta name="expires" content="-1" />
    <meta name="pragma" content="no-cache" />
    <meta name="last-modified" content="__BUILD_VERSION__" />
    <meta name="version" content="__BUILD_VERSION__" />
    <meta name="cache-buster" content="v20251217_1765975100925" />
    <meta name="build-time" content="__BUILD_TIME__" />
    <meta name="cdn-purge" content="__BUILD_TIME__" />

    <!-- iPhone/Safari specific headers -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>

    <!-- Basic Reset Only -->
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
      }
    </style>

    <!-- 🔥 NUCLEAR CACHE BUSTING - FORCES UPDATE ON ALL BROWSERS -->
    <script>
      (function() {
        const BUILD_VERSION = '__BUILD_VERSION__';
        const FORCE_UPDATE_VERSION = 'v20251217_DOMAIN_CACHE_FIX';

        console.log('%c🔥 منصة النخيل والزيتون', 'color:#10b981;font-size:20px;font-weight:bold');
        console.log('%cVersion: ' + BUILD_VERSION, 'color:#3b82f6;font-size:14px');
        console.log('%cForce Update: ' + FORCE_UPDATE_VERSION, 'color:#ef4444;font-size:14px;font-weight:bold');

        // ALWAYS check for updates on ALL browsers
        const lastForceUpdate = localStorage.getItem('force-update-version');
        const lastAppVersion = localStorage.getItem('app-version');
        const lastCheckTime = parseInt(localStorage.getItem('last-check-time') || '0');
        const now = Date.now();

        // Force check every 5 minutes OR if version changed
        const shouldForceCheck = (now - lastCheckTime > 5 * 60 * 1000) ||
                                 (lastForceUpdate !== FORCE_UPDATE_VERSION) ||
                                 (lastAppVersion !== BUILD_VERSION);

        if (shouldForceCheck) {
          console.log('%c🔄 Checking for updates...', 'color:#f59e0b;font-size:14px;font-weight:bold');

          // Check if this is a cached version by fetching version-manifest.json
          fetch('/version-manifest.json?t=' + Date.now(), {
            cache: 'no-store',
            headers: {
              'Cache-Control': 'no-cache, no-store, must-revalidate',
              'Pragma': 'no-cache'
            }
          })
            .then(r => r.json())
            .then(manifest => {
              console.log('%cServer version:', 'color:#10b981', manifest.version);
              console.log('%cLocal version:', 'color:#3b82f6', BUILD_VERSION);

              // If versions don't match OR force update version changed
              if (manifest.version !== BUILD_VERSION || lastForceUpdate !== FORCE_UPDATE_VERSION) {
                console.log('%c🔥 NEW VERSION DETECTED - FORCING UPDATE!', 'color:#ef4444;font-size:16px;font-weight:bold');

                // Clear ALL caches aggressively
                if ('caches' in window) {
                  caches.keys().then(names => {
                    console.log('%cClearing ' + names.length + ' cache(s)...', 'color:#f59e0b');
                    return Promise.all(names.map(name => {
                      console.log('%c  🗑️ Deleting cache: ' + name, 'color:#ef4444');
                      return caches.delete(name);
                    }));
                  }).then(() => {
                    console.log('%c✅ All caches cleared!', 'color:#10b981;font-weight:bold');
                    performForceReload();
                  });
                } else {
                  performForceReload();
                }

                function performForceReload() {
                  // Clear localStorage for this check
                  localStorage.removeItem('force-update-version');
                  localStorage.removeItem('app-version');
                  localStorage.removeItem('last-check-time');

                  // Add timestamp to URL to bypass ALL caches
                  const url = new URL(window.location.href);
                  url.searchParams.set('_t', Date.now());
                  url.searchParams.set('_v', manifest.version || FORCE_UPDATE_VERSION);

                  console.log('%c🚀 Reloading with cache bypass...', 'color:#8b5cf6;font-size:14px;font-weight:bold');

                  // Wait a bit then reload
                  setTimeout(() => {
                    window.location.href = url.toString();
                  }, 500);
                }
              } else {
                console.log('%c✅ Already on latest version', 'color:#10b981;font-size:14px;font-weight:bold');

                // Update stored versions
                localStorage.setItem('force-update-version', FORCE_UPDATE_VERSION);
                localStorage.setItem('app-version', BUILD_VERSION);
                localStorage.setItem('last-check-time', now.toString());
              }
            })
            .catch(err => {
              console.log('%c⚠️ Could not check version (may be offline)', 'color:#f59e0b', err.message);

              // Still update local storage on error
              localStorage.setItem('force-update-version', FORCE_UPDATE_VERSION);
              localStorage.setItem('app-version', BUILD_VERSION);
              localStorage.setItem('last-check-time', now.toString());
            });
        } else {
          console.log('%c✅ Version check skipped (checked recently)', 'color:#10b981;font-size:12px');
        }

        // Also check on visibility change (when user returns to tab)
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) {
            const lastCheck = parseInt(localStorage.getItem('last-check-time') || '0');
            const timeSinceLastCheck = Date.now() - lastCheck;

            // If more than 1 minute since last check, check again
            if (timeSinceLastCheck > 60 * 1000) {
              console.log('%c🔄 Tab became visible - checking for updates...', 'color:#f59e0b;font-size:12px');
              localStorage.removeItem('last-check-time'); // Force next check
              setTimeout(() => window.location.reload(), 100);
            }
          }
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
