<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // FORCE CLEAR CACHE FOR DARK THEME
      (function() {
        const VERSION = 'DARK_v20251030_' + Math.random();
        const stored = localStorage.getItem('theme-v');
        
        if (!stored || !stored.includes('DARK')) {
          console.log('%c🔥 CLEARING FOR DARK THEME', 'color:red;font-size:24px');
          
          if ('caches' in window) {
            caches.keys().then(n => n.forEach(k => caches.delete(k)));
          }
          
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(r => r.forEach(s => s.unregister()));
          }
          
          const auth = {};
          ['admin_session_token', 'admin_data'].forEach(k => {
            if (localStorage.getItem(k)) auth[k] = localStorage.getItem(k);
          });
          
          localStorage.clear();
          Object.keys(auth).forEach(k => localStorage.setItem(k, auth[k]));
          localStorage.setItem('theme-v', VERSION);
          
          setTimeout(() => location.reload(true), 500);
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
