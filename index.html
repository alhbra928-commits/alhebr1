<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#064e3b" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <title>منصة النخيل والزيتون</title>
  </head>
  <body>
    <div id="root"></div>
    
    <script>
      // ULTRA AGGRESSIVE CACHE CLEAR - ALWAYS RUNS
      (function() {
        const CURRENT_VERSION = 'DARK_FINAL_v20251030_002';
        const stored = localStorage.getItem('app-version');

        console.log('%c🔍 VERSION CHECK', 'color:blue;font-size:20px;font-weight:bold');
        console.log('Current:', CURRENT_VERSION);
        console.log('Stored:', stored);

        if (stored !== CURRENT_VERSION) {
          console.log('%c🔥 FORCING COMPLETE CACHE CLEAR', 'color:red;font-size:24px;font-weight:bold');
          console.log('%c⚠️ المتصفح سيعيد التحميل بعد حذف كل الـ cache', 'color:orange;font-size:18px');

          // حفظ بيانات المصادقة
          const auth = {};
          const authKeys = ['admin_session_token', 'admin_data', 'investor_phone', 'investor_data'];
          authKeys.forEach(k => {
            const val = localStorage.getItem(k);
            if (val) auth[k] = val;
          });

          // حذف كل الـ caches
          if ('caches' in window) {
            caches.keys().then(names => {
              console.log('%c🗑️ Deleting ' + names.length + ' caches...', 'color:red;font-size:16px');
              names.forEach(name => caches.delete(name));
            });
          }

          // حذف Service Workers
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => {
              console.log('%c🗑️ Unregistering ' + regs.length + ' service workers...', 'color:red;font-size:16px');
              regs.forEach(reg => reg.unregister());
            });
          }

          // مسح كامل للـ storage
          localStorage.clear();
          sessionStorage.clear();

          // استرجاع بيانات المصادقة
          Object.keys(auth).forEach(k => localStorage.setItem(k, auth[k]));

          // حفظ النسخة الجديدة
          localStorage.setItem('app-version', CURRENT_VERSION);
          localStorage.setItem('last-update', new Date().toISOString());

          console.log('%c✅ CACHE CLEARED - RELOADING IN 1 SECOND', 'color:green;font-size:20px;font-weight:bold');

          // إعادة تحميل قوية
          setTimeout(() => {
            window.location.href = window.location.href + (window.location.href.includes('?') ? '&' : '?') + '_nocache=' + Date.now();
          }, 1000);
        } else {
          console.log('%c✅ VERSION MATCH - NO UPDATE NEEDED', 'color:green;font-size:18px;font-weight:bold');
        }
      })();
    </script>
    
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
